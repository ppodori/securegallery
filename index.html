<script>
const CONFIG = {
  CLIENT_ID: '914768806134-ur8saf3irah9l9maqk6g5mb1mgif8urg.apps.googleusercontent.com',
  SCOPES: 'https://www.googleapis.com/auth/drive.file',
  ROOT_NAME: 'SecureGallery',
  PBKDF2_ITERATIONS: 600000,
};

// ============================================================
// Crypto
// ============================================================
// Shared inline SVG icons (consistent rendering on every platform; no emoji substitution)
const SGI = {
  play: '<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.6v14.8a1 1 0 0 0 1.53.85l11.6-7.4a1 1 0 0 0 0-1.7L8.53 3.75A1 1 0 0 0 7 4.6z"/></svg>',
  heart: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
  chev: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>',
  check: '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
  x: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  hudPlay: '<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.6v14.8a1 1 0 0 0 1.53.85l11.6-7.4a1 1 0 0 0 0-1.7L8.53 3.75A1 1 0 0 0 7 4.6z"/></svg>',
  hudPause: '<svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg>',
};

const Crypto = {
  async deriveKey(pw, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:CONFIG.PBKDF2_ITERATIONS,hash:'SHA-256'}, km, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
  },
  async decrypt(key, data) {
    const b = new Uint8Array(data);
    return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)}, key, b.slice(12));
  },
  async encrypt(key, data) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const buf = typeof data === 'string' ? new TextEncoder().encode(data) : data;
    const enc = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, buf);
    const out = new Uint8Array(12 + enc.byteLength); out.set(iv); out.set(new Uint8Array(enc), 12);
    return out.buffer;
  },
  async decryptJSON(key, data) {
    return JSON.parse(new TextDecoder().decode(await this.decrypt(key, data)));
  },
  async encryptJSON(key, obj) {
    return this.encrypt(key, JSON.stringify(obj));
  },
  fromB64(s) { const b=atob(s),a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a.buffer; }
};

// ============================================================
// Drive
// ============================================================
const Drive = {
  token: null,
  async listIndexFiles() {
    const out = []; let pageToken = '';
    const q = "name='_index.enc' and trashed=false";
    do {
      const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,parents,modifiedTime)&pageSize=1000${pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : ''}`;
      const r = await this._fetch(url);
      if (!r.ok) throw new Error(`Drive ${r.status}`);
      const j = await r.json();
      out.push(...(j.files || []));
      pageToken = j.nextPageToken || '';
    } while (pageToken);
    return out;
  },
  hdr() { return {Authorization:`Bearer ${this.token}`}; },
  async _fetch(url, opts = {}) {
    opts.headers = { ...opts.headers, ...this.hdr() };
    let r = await fetch(url, opts);
    if (r.status === 401) {
      // Token expired, try silent refresh
      try { await app._silentRefresh(); } catch {}
      opts.headers = { ...opts.headers, ...this.hdr() };
      r = await fetch(url, opts);
    }
    return r;
  },
  async listFolders(parentId) {
    const q = `'${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const r = await this._fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)&pageSize=200`);
    if (!r.ok) throw new Error(`Drive ${r.status}`);
    const files = (await r.json()).files || [];
    return files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
  },
  async findFile(name, parentId) {
    const q = `name='${name}' and '${parentId}' in parents and trashed=false`;
    const r = await this._fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)&pageSize=1`);
    if (!r.ok) throw new Error(`Drive ${r.status}`);
    return ((await r.json()).files || [])[0]?.id || null;
  },
  async findFolderByName(name, parentId) {
    const q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`;
    const r = await this._fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)&pageSize=1`);
    if (!r.ok) return null;
    return ((await r.json()).files || [])[0]?.id || null;
  },
  async download(fileId) {
    const r = await this._fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if (!r.ok) throw new Error(`Download ${r.status}`);
    return r.arrayBuffer();
  },
  async upload(name, data, parentId) {
    const fd = new FormData();
    fd.append('metadata', new Blob([JSON.stringify({name, parents:[parentId]})], {type:'application/json'}));
    fd.append('file', new Blob([data], {type:'application/octet-stream'}));
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method:'POST', headers:{Authorization:`Bearer ${this.token}`}, body:fd
    });
    if (!r.ok) throw new Error(`Upload ${r.status}`);
    return (await r.json()).id;
  },
  async update(fileId, data) {
    const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method:'PATCH', headers:{Authorization:`Bearer ${this.token}`,'Content-Type':'application/octet-stream'}, body:data
    });
    if (!r.ok) throw new Error(`Update ${r.status}`);
  }
};

// ============================================================
// ThumbDB - persistent ciphertext cache for thumbnails
// Stores the *encrypted* bytes exactly as they come from Drive, keyed by
// driveId (immutable), so the at-rest security model is unchanged. Every
// method fails silently and falls back to the network.
// ============================================================
const ThumbDB = {
  _db: null,
  _ready: null,
  _off: false,
  _writes: 0,
  get LIMIT() { return app._isMobile ? 8000 : 20000; },

  _open() {
    if (this._off) return Promise.resolve(null);
    if (this._ready) return this._ready;
    this._ready = new Promise(res => {
      let req;
      try { req = indexedDB.open('sg_thumbs', 1); }
      catch { this._off = true; return res(null); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('blobs')) {
          db.createObjectStore('blobs', { keyPath: 'id' }).createIndex('ts', 'ts');
        }
      };
      req.onsuccess = () => {
        this._db = req.result;
        this._db.onclose = () => { this._db = null; this._ready = null; };
        this._db.onversionchange = () => { try { this._db.close(); } catch {} };
        try { navigator.storage?.persist?.(); } catch {}
        res(this._db);
      };
      req.onerror = () => { this._off = true; res(null); };
      req.onblocked = () => { this._off = true; res(null); };
    });
    return this._ready;
  },

  async get(id) {
    const db = await this._open();
    if (!db) return null;
    return new Promise(res => {
      try {
        const r = db.transaction('blobs', 'readonly').objectStore('blobs').get(id);
        r.onsuccess = () => res(r.result ? r.result.buf : null);
        r.onerror = () => res(null);
      } catch { res(null); }
    });
  },

  async put(id, buf) {
    const db = await this._open();
    if (!db) return;
    try {
      const tx = db.transaction('blobs', 'readwrite');
      tx.onerror = e => { e.preventDefault?.(); };   // quota etc: ignore
      tx.onabort = e => { e.preventDefault?.(); };
      tx.objectStore('blobs').put({ id, buf, ts: Date.now() });
    } catch {}
    if (++this._writes % 200 === 0) this._evict();
  },

  async del(id) {
    const db = await this._open();
    if (!db) return;
    try {
      const tx = db.transaction('blobs', 'readwrite');
      tx.onerror = e => { e.preventDefault?.(); };
      tx.onabort = e => { e.preventDefault?.(); };
      tx.objectStore('blobs').delete(id);
    } catch {}
  },

  // Trim oldest entries when over the cap (FIFO by insertion time).
  async _evict() {
    const db = await this._open();
    if (!db) return;
    try {
      const st = db.transaction('blobs', 'readwrite').objectStore('blobs');
      const cReq = st.count();
      cReq.onsuccess = () => {
        let over = cReq.result - Math.floor(this.LIMIT * 0.9);
        if (over <= 0) return;
        const cur = st.index('ts').openCursor();
        cur.onsuccess = () => {
          const c = cur.result;
          if (!c || over <= 0) return;
          c.delete(); over--;
          c.continue();
        };
      };
    } catch {}
  },

  async clear() {
    const db = await this._open();
    if (!db) return;
    try { db.transaction('blobs', 'readwrite').objectStore('blobs').clear(); } catch {}
  }
};

  _saveScrollToHistory() {
    const scroll = document.getElementById('contentScroll');
    if (!scroll || !history.state) return;
    const grid = document.getElementById('galleryGrid');
    if (grid) {
      // Gallery view: save item index
      const items = grid.querySelectorAll('.gallery-item');
      let visibleIdx = 0;
      const scrollTop = scroll.getBoundingClientRect().top;
      for (const item of items) {
        if (item.getBoundingClientRect().top >= scrollTop) {
          visibleIdx = parseInt(item.dataset.idx) || 0;
          break;
        }
      }
      history.replaceState({ ...history.state, restoreIdx: visibleIdx }, '');
    } else {
      // Main page: save raw scrollTop
      history.replaceState({ ...history.state, restoreScrollTop: scroll.scrollTop }, '');
    }
  },

  // ===== AUTH =====
  async login() {
    const pw = document.getElementById('passwordInput').value;
    if (!pw) return this.showError('비밀번호를 입력하세요.');
    const btn = document.getElementById('loginBtn');
    if (btn.disabled) return;  // already logging in
    btn.disabled = true; btn.textContent = '인증 중...';
    try {
      await this.auth();
      btn.textContent = 'Drive 연결 중...';
      this.rootDriveId = await Drive.findFolderByName(CONFIG.ROOT_NAME, 'root');
      if (!this.rootDriveId) {
        // Cached token might be invalid, force re-auth
        localStorage.removeItem('sg_token');
        localStorage.removeItem('sg_token_expiry');
        await this.auth(true);
        this.rootDriveId = await Drive.findFolderByName(CONFIG.ROOT_NAME, 'root');
      }
      if (!this.rootDriveId) { btn.disabled=false; btn.textContent='시작하기'; return this.showError('SecureGallery 폴더가 Drive에 없습니다.'); }
      btn.textContent = '암호화 키 확인 중...';
      const configId = await Drive.findFile('config.json', this.rootDriveId);
      if (!configId) { btn.disabled=false; btn.textContent='시작하기'; return this.showError('config.json을 찾을 수 없습니다.'); }
      const config = JSON.parse(new TextDecoder().decode(await Drive.download(configId)));
      this.key = await Crypto.deriveKey(pw, new Uint8Array(Crypto.fromB64(config.salt)));
      sessionStorage.setItem('sg_pw', pw);
      // "이 브라우저에서 비밀번호 기억": keep across browser/app restarts; unchecked clears any saved copy
      try {
        if (document.getElementById('rememberPw')?.checked) localStorage.setItem('sg_pw_keep', pw);
        else localStorage.removeItem('sg_pw_keep');
      } catch {}
      await Promise.all([this.loadHidden(), this.loadFavorites(), this.buildTree(this.rootDriveId)]);
      this._repairFavMtime(); // background, non-blocking
      this.navStack = [];
      this.navTo(this.rootDriveId, CONFIG.ROOT_NAME);
    } catch (e) {
      console.error(e); btn.disabled=false; btn.textContent='시작하기';
      this.showError('연결 실패: ' + e.message);
    }
  },

  auth(force) {
    return new Promise((res, rej) => {
      // Check saved token
      if (!force) {
        const saved = localStorage.getItem('sg_token');
        const expiry = localStorage.getItem('sg_token_expiry');
        if (saved && expiry && Date.now() < parseInt(expiry)) {
          Drive.token = saved;
          this._scheduleRefresh(parseInt(expiry));
          return res();
        }
      }
      const ck = () => {
        if (typeof google === 'undefined' || !google.accounts) return setTimeout(ck, 100);
        this._tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CONFIG.CLIENT_ID, scope: CONFIG.SCOPES,
          callback: r => {
            if(r.error) return rej(new Error(r.error));
            this._setToken(r);
            res();
          },
          error_callback: e => rej(new Error(e.message||'Auth failed'))
        });
        this._tokenClient.requestAccessToken();
      };
      ck();
    });
  },

  _setToken(r) {
    Drive.token = r.access_token;
    const expiry = Date.now() + (r.expires_in || 3600) * 1000;
    localStorage.setItem('sg_token', r.access_token);
    localStorage.setItem('sg_token_expiry', String(expiry));
    this._scheduleRefresh(expiry);
  },

  _scheduleRefresh(expiry) {
    if (this._refreshTimer) clearTimeout(this._refreshTimer);
    // Refresh 5 minutes before expiry
    const delay = Math.max(0, expiry - Date.now() - 5 * 60 * 1000);
    this._refreshTimer = setTimeout(() => this._silentRefresh(), delay);
  },

  async _silentRefresh() {
    try {
      if (!this._tokenClient) {
        if (typeof google === 'undefined' || !google.accounts) return;
        this._tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CONFIG.CLIENT_ID, scope: CONFIG.SCOPES,
          callback: () => {},
          error_callback: () => {}
        });
      }
      await new Promise((res, rej) => {
        this._tokenClient.callback = r => {
          if (r.error) return rej(new Error(r.error));
          this._setToken(r);
          console.log('토큰 자동 갱신 완료');
          res();
        };
        this._tokenClient.error_callback = e => rej(e);
        this._tokenClient.requestAccessToken({ prompt: '' });
      });
    } catch (e) {
      console.warn('토큰 자동 갱신 실패:', e);
    }
  },

  logout() {
    if (this._refreshTimer) clearTimeout(this._refreshTimer);
    Drive.token=null; this.key=null; this.treeCache={};
    localStorage.removeItem('sg_token');
    localStorage.removeItem('sg_token_expiry');
    localStorage.removeItem('sg_lucky');
    localStorage.removeItem('sg_r1000');
    sessionStorage.removeItem('sg_pw');
    try { localStorage.removeItem('sg_pw_keep'); } catch {}
    const _rp = document.getElementById('rememberPw'); if (_rp) _rp.checked = false;
    this.thumbCache.forEach(u=>URL.revokeObjectURL(u)); this.thumbCache.clear();
    this._thumbCacheOrder = []; this._thumbQueue = []; this._thumbLoading = 0;
    document.getElementById('passwordInput').value='';
    this.showScreen('loginScreen');
    document.getElementById('loginBtn').disabled=false;
    document.getElementById('loginBtn').textContent='시작하기';
  },

  // ===== SIDEBAR TREE =====
  async buildTree(rootId) {
    const subs = await Drive.listFolders(rootId);
    this.treeCache[rootId] = subs.filter(f => f.name !== 'index' && f.name !== 'thumbs' && f.name !== 'files');
    // Pre-load 0_MOV children for grouped display
    const movFolder = this.treeCache[rootId].find(f => f.name === '0_MOV');
    if (movFolder) {
      this.treeCache[movFolder.id] = await Drive.listFolders(movFolder.id);
    }
  },

  _buildNavStack(targetId, rootId) {
    // BFS through treeCache to find path
    const path = [];
    const find = (parentId, trail) => {
      const children = this.treeCache[parentId];
      if (!children) return false;
      for (const child of children) {
        const newTrail = [...trail, {id: child.id, name: child.name}];
        if (child.id === targetId) { path.push(...newTrail); return true; }
        if (find(child.id, newTrail)) return true;
      }
      return false;
    };
    find(rootId, []);
    return path;
  },

  // ===== NAVIGATION =====
  async navTo(folderId, folderName) {
    this.currentFolderId = folderId;
    this.currentFiles = [];
    this.stopSlideshow(true);
    // Clear preload cache on folder change
    if (this.bgPreloadAbort) this.bgPreloadAbort.abort = true;
    if (this._thumbObserver) this._thumbObserver.disconnect();
    if (this._spacerObs) { this._spacerObs.disconnect(); this._spacerObs = null; }
    this._spacerEndIdx = 0;
    this._thumbQueue = [];
    this.preloadCache.forEach(u => URL.revokeObjectURL(u));
    this.preloadCache.clear();

    if (folderId === this.rootDriveId) this.navStack = [];
    this.shuffled = false;
    this.selectedSet.clear(); this._lastSelectedIdx = -1;
    this.originalFiles = [];
    this._monthFilters.clear();
    const _mChip = document.getElementById('monthFilterChip'); if (_mChip) _mChip.remove();
    const _mPanel = document.getElementById('monthPickerPanel'); if (_mPanel) _mPanel.classList.remove('open');
    const _mBtn = document.getElementById('monthPickerBtn'); if (_mBtn) { _mBtn.classList.remove('active'); _mBtn.classList.remove('filtered'); }
    this._favMode = false;
    this._trashMode = false;
    this._currentSort = 'date_desc';
    this._favFilter = 'all';
    this._orientFilter = 'all';
    this._favStatusFilter = 'all';
    this._folderFilesCache = null;
    const filterDiv = document.getElementById('favFilterDiv');
    if (filterDiv) filterDiv.style.display = 'none';
    const sortAddedBtn = document.getElementById('sortAddedBtn');
    if (sortAddedBtn) sortAddedBtn.style.display = 'none';
    const nameArrow = document.getElementById('sortNameArrow');
    const sizeArrow = document.getElementById('sortSizeArrow');
    const dateArrow = document.getElementById('sortDateArrow');
    if (nameArrow) nameArrow.textContent = '↑';
    if (sizeArrow) sizeArrow.textContent = '↑';
    if (dateArrow) dateArrow.textContent = '↓';

    this.showScreen('mainScreen');
    this.renderBreadcrumb();
    if (!this._skipHistory) {
      this._saveScrollToHistory();
      const state = { view: 'folder', folderId, folderName, navStack: JSON.parse(JSON.stringify(this.navStack)) };
      if (folderId === this.rootDriveId && !this._hasInitialState) {
        history.replaceState(state, '');
        this._hasInitialState = true;
      } else {
        history.pushState(state, '');
      }
    }

    const area = document.getElementById('contentArea');
    area.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
    document.getElementById('toolbar').style.display = 'none';

    try {
      // Subfolders
      if (!this.treeCache[folderId]) {
        this.treeCache[folderId] = await Drive.listFolders(folderId);
      }
      const subfolders = folderId === this.rootDriveId
        ? (this.treeCache[folderId] || []).filter(f => f.name !== 'index' && f.name !== 'thumbs' && f.name !== 'files')
        : (this.treeCache[folderId] || []);

      // Index
      const indexId = await Drive.findFile('_index.enc', folderId);
      let files = [];
      if (indexId) {
        try {
          const allFiles = await Crypto.decryptJSON(this.key, await Drive.download(indexId));
          files = allFiles.filter(f => !this.hiddenSet.has(f.origDriveId));
          // Auto-sort by date (newest first)
          files.sort((a, b) => {
            const at = a.mtime || 0, bt = b.mtime || 0;
            if (!at && !bt) return 0;
            if (!at) return 1;
            if (!bt) return -1;
            return bt - at;
          });
          this.currentFiles = files;
        } catch (e) { console.error(e); this.toast('인덱스 복호화 실패'); }
      }

      this.renderView(subfolders, files);
    } catch (e) {
      console.error(e);
      area.innerHTML = `<div class="empty-state">❌ ${this.esc(e.message)}</div>`;
    }
  },

  renderBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    if (!this.navStack.length) { bc.innerHTML = ''; return; }
    const total = this.navStack.length;
    let h = '';
    for (let i = 0; i < total; i++) {
      const item = this.navStack[i];
      const isFirst = i === 0;
      const isLast = i === total - 1;
      const isMiddle = !isFirst && !isLast;

      // Separator before this item (hidden on mobile if middle)
      if (i > 0) h += `<span class="sep${isMiddle ? ' bc-middle' : ''}">›</span>`;

      if (isLast) {
        h += `<span class="current">${this.esc(item.name)}</span>`;
      } else if (isMiddle) {
        h += `<a href="#" class="bc-middle" onclick="app.goTo(${i});return false;">${this.esc(item.name)}</a>`;
      } else {
        // First item
        h += `<a href="#" onclick="app.goTo(${i});return false;">${this.esc(item.name)}</a>`;
        // Ellipsis after first (shown on mobile when total > 2)
        if (total > 2) {
          h += `<span class="bc-ellipsis"><span class="sep">›</span><span>...</span></span>`;
        }
      }
    }
    bc.innerHTML = h;
  },

  goRoot() { this.navStack=[]; this.navTo(this.rootDriveId, CONFIG.ROOT_NAME); },
  goTo(i) { this.navStack=this.navStack.slice(0,i+1); this.navTo(this.navStack[i].id, this.navStack[i].name); },

            <span class="fc-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke:var(--text2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
            <span class="fc-cap"><span class="fc-name">${this.esc(f.name)}</span><span class="fc-count"></span></span>
          </div>`;
        }
        h += `</div>`;
      }
    }

    if (files.length > 0) {
      const toolbar = document.getElementById('toolbar');
      toolbar.style.display = 'flex';
      this._updateFileCount(files);
      const ba = document.getElementById('batchActions'); if (ba) ba.classList.remove('show');
      // Show filter div in subfolders (not root)
      if (this.currentFolderId !== this.rootDriveId) {
        this._folderFilesCache = [...files];
        let filterDiv = document.getElementById('favFilterDiv');
        if (!filterDiv) {
          filterDiv = document.createElement('div');
          filterDiv.id = 'favFilterDiv';
          filterDiv.className = 'fav-filter';
          filterDiv.innerHTML = this._getFilterHTML(true);
          toolbar.insertBefore(filterDiv, toolbar.querySelector('.spacer'));
        } else {
          filterDiv.style.display = 'flex';
          filterDiv.innerHTML = this._getFilterHTML(true);
        }
      }
      h += `<div class="gallery-grid" id="galleryGrid" style="grid-template-columns:repeat(auto-fill,minmax(${this.gridSize}px,1fr))"></div>`;
    } else {
      document.getElementById('toolbar').style.display = subfolders.length > 0 ? 'none' : 'none';
      if (subfolders.length === 0 && this.currentFolderId !== this.rootDriveId) h += `<div class="empty-state">비어 있는 폴더입니다.</div>`;
    }

    // Trash section on root page
    if (this.currentFolderId === this.rootDriveId && this.hiddenData.length > 0) {
      h += `<div class="lucky-section" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
        <div class="lucky-title" style="color:var(--text2)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2m1 0v14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V6"/></svg> 휴지통 <span style="font-size:12px;font-weight:400">${this.hiddenData.length}개</span>
          <button onclick="app.openTrash()" style="margin-left:8px">모두 보기</button>
        </div>
        <div class="lucky-grid" id="trashGrid"></div>
      </div>`;
    }

    area.innerHTML = h;
    if (files.length > 0) this.renderGallery();
    if (this.currentFolderId === this.rootDriveId) {
      this.renderFavGrid();
      this.renderTrashPreview();
      this.loadRandom1000();
      this.loadLuckyPicks();
    }
    this._updateFilterIndicator();
    if (subfolders.length > 0) {
      this._paintFolderCovers();
      clearTimeout(this._fmetaTimer);
      this._fmetaTimer = setTimeout(() => this._refreshFolderMeta(), 1500);
    }
  },

  // ===== GALLERY =====
  renderGallery() {
    const grid = document.getElementById('galleryGrid');
    if (!grid) return;
    grid.innerHTML = '';
    const gridSlider = document.getElementById('gridSlider');
    if (gridSlider) gridSlider.value = this.gridSize;

    // Empty state when filter/search yields no results
    if (!this.currentFiles.length) {
      const filtersActive = this._favFilter !== 'all' || this._orientFilter !== 'all' || this._favStatusFilter !== 'all' || this._monthFilters.size > 0;
      grid.style.gridTemplateColumns = '1fr';
      if (filtersActive) {
        grid.innerHTML = `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="opacity:0.5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          <div style="font-weight:600;">조건에 맞는 파일이 없습니다</div>
          <div style="font-size:13px;opacity:0.7;">필터를 해제하거나 다른 조건으로 시도해보세요</div>
          <button class="btn-secondary" style="margin-top:8px;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);" onclick="app.resetAllFilters()">필터 초기화</button>
        </div>`;
      } else {
        grid.innerHTML = `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="opacity:0.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          <div>비어 있는 폴더입니다</div>
        </div>`;
      }
      return;
    }
    // Restore grid columns if previously set to 1fr for empty state
    grid.style.gridTemplateColumns = `repeat(auto-fill,minmax(${this.gridSize}px,1fr))`;

    const BATCH = this._isMobile ? 30 : 50;
    this._galleryLoaded = 0;
    this._lastRenderedMonth = null;
    this._lastRenderedWeek = null;
    this._collapsedKeys = new Set();

    // Lazy thumb observer
    if (this._thumbObserver) this._thumbObserver.disconnect();
    const rootMargin = this._isMobile ? '200px' : '400px';
    this._thumbObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const el = entry.target;
        const driveId = el.dataset.thumbId;
        if (driveId) { this.loadThumb(driveId, el); el.removeAttribute('data-thumb-id'); }
        this._thumbObserver.unobserve(el);
      }
    }, { root: document.getElementById('contentScroll'), rootMargin });

    this._galleryLoadBatch = () => {
      const end = Math.min(this._galleryLoaded + BATCH, this.currentFiles.length);
      const frag = document.createDocumentFragment();
      const toObserve = [];
      const showDateSep = this._currentSort === 'date_asc' || this._currentSort === 'date_desc';
      for (let i = this._galleryLoaded; i < end; i++) {
        const file = this.currentFiles[i];
        // Date separator (month + collapsible week)
        let _mKey = null, _wKey = null;
        if (showDateSep) {
          _mKey = file.mtime
            ? `${new Date(file.mtime).getFullYear()}-${String(new Date(file.mtime).getMonth()+1).padStart(2,'0')}`
            : '__none__';
          if (_mKey !== this._lastRenderedMonth) {
            this._lastRenderedMonth = _mKey;
            this._lastRenderedWeek = null;
            const mk = _mKey;
            const sep = document.createElement('div');
            sep.className = 'date-sep' + (this._collapsedKeys.has(mk) ? ' collapsed' : '');
            sep.dataset.month = mk;
            sep.onclick = (e) => { if (e.target.closest('.sep-chev')) this.toggleSection(mk); };
            if (file.mtime) {
              const d = new Date(file.mtime);
              sep.innerHTML = `<span class="sep-chev">${SGI.chev}</span>${d.getFullYear()}년 ${d.getMonth()+1}월`;
            } else {
              sep.innerHTML = `<span class="sep-chev">${SGI.chev}</span>날짜 없음`;
            }
            frag.appendChild(sep);
          }
          if (file.mtime) {
            const d = new Date(file.mtime);
            _wKey = `${_mKey}-W${Math.ceil(d.getDate()/7)}`;
            if (_wKey !== this._lastRenderedWeek) {
              this._lastRenderedWeek = _wKey;
              const mk = _mKey, wk = _wKey;
              const wsep = document.createElement('div');
              wsep.className = 'week-sep' + (this._collapsedKeys.has(wk) ? ' collapsed' : '');
              wsep.dataset.month = mk;
              wsep.dataset.week = wk;
              if (this._collapsedKeys.has(mk)) wsep.style.display = 'none';
              wsep.onclick = (e) => { if (e.target.closest('.sep-chev')) this.toggleSection(wk); };
              wsep.innerHTML = `<span class="sep-chev">${SGI.chev}</span>${Math.ceil(d.getDate()/7)}주차`;
              frag.appendChild(wsep);
            }
          }
        }
        const el = document.createElement('div');
        el.className = 'gallery-item' + (this.selectedSet.has(file.origDriveId) ? ' selected' : '');
        el.dataset.idx = i;
        if (_mKey) {
          el.dataset.month = _mKey;
          if (_wKey) el.dataset.week = _wKey;
          if (this._collapsedKeys.has(_mKey) || (_wKey && this._collapsedKeys.has(_wKey))) el.style.display = 'none';
        }
        el.onclick = (e) => {
          if (e.target.closest('.sel-check')) return;
          this.openLightbox(i);
        };
        if (file.type?.startsWith('video/')) {
          if (this._isMobile) el.addEventListener('touchstart', () => this._intentPrefetch(file), { passive: true });
          else {
            let _ht = null;
            el.addEventListener('mouseenter', () => { _ht = setTimeout(() => this._intentPrefetch(file), 120); });
            el.addEventListener('mouseleave', () => clearTimeout(_ht));
          }
        }
        const cached = this.thumbCache.get(file.thumbDriveId);
        let ih = cached ? `<img src="${cached}" decoding="async">` : `<div class="loading-placeholder"><div class="spinner"></div></div>`;
        if (file.type?.startsWith('video/')) ih += `<div class="vid-badge">${SGI.play}</div>`;
        if (this.favSet.has(file.origDriveId)) ih += `<div class="fav-badge">${SGI.heart}</div>`;
        if (file._folderName) {
          const dateTag = file.mtime ? `<span style="opacity:0.6;margin-left:4px">${new Date(file.mtime).toISOString().slice(0,10)}</span>` : '';
          ih += `<div class="li-badge">${this.esc(file._folderName)}${dateTag}</div>`;
        }
        const dateStr = file.mtime ? new Date(file.mtime).toISOString().slice(0, 10) : '';
        if (dateStr) ih += `<div class="hover-info"><div class="hi-date">${dateStr}</div></div>`;
        ih += `<div class="frame-num"><span>▸ ${String(i+1).padStart(3,'0')}</span>${dateStr ? `<span class="fn-date">${dateStr.slice(2).replace(/-/g,'·')}</span>` : ''}</div>`;
        ih += `<div class="sel-check" onclick="event.stopPropagation();app.toggleSelect(${i},event.shiftKey)"></div>`;
        el.innerHTML = ih;
        if (!cached) { el.dataset.thumbId = file.thumbDriveId; toObserve.push(el); }
        frag.appendChild(el);
      }
      grid.appendChild(frag);
      for (const el of toObserve) this._thumbObserver.observe(el);
      this._galleryLoaded = end;
      const oldSent = grid.querySelector('.batch-sentinel');
      if (oldSent) oldSent.remove();
      if (this._galleryLoaded < this.currentFiles.length) {
        const sent = document.createElement('div');
        sent.className = 'batch-sentinel';
        grid.appendChild(sent);
        const obs = new IntersectionObserver(entries => {
          if (entries[0].isIntersecting) { obs.disconnect(); sent.remove(); this._galleryLoadBatch(); }
        });
        obs.observe(sent);
      }
    };
    this._galleryLoadBatch();
  },

  async loadThumb(driveId, el) {
    if (!driveId) return;
    // Queue-based: add to queue and process
    this._thumbQueue.push({ driveId, el });
    this._processThumbQueue();
  },

  async _processThumbQueue() {
    while (this._thumbQueue.length > 0 && this._thumbLoading < this._thumbConcurrency) {
      // Visible-first: pick the queued item nearest to the viewport (dead items are purged first)
      let _bi = 0, _bs = Infinity;
      const _vh = window.innerHeight;
      const _qn = Math.min(this._thumbQueue.length, 250);
      for (let qi = 0; qi < _qn; qi++) {
        const q = this._thumbQueue[qi];
        if (!q.el.isConnected) { _bi = qi; _bs = -1; break; }
        if (q.el.offsetParent === null) continue;
        const r = q.el.getBoundingClientRect();
        const s = (r.bottom < 0 || r.top > _vh) ? Math.min(Math.abs(r.bottom), Math.abs(r.top - _vh)) : 0;
        if (s < _bs) { _bs = s; _bi = qi; if (s === 0) break; }
      }
      const item = this._thumbQueue.splice(_bi, 1)[0];
      // Skip disconnected elements (user navigated away)
      if (!item.el.isConnected) continue;
      // Skip gallery items that scrolled far out of view
      if (!item.isPreview && item.el.dataset.idx) {
        // Collapsed sections: display:none items report zero rects and pass the range check below
        if (item.el.offsetParent === null) {
          if (item.driveId) {
            item.el.dataset.thumbId = item.driveId;
            this._thumbObserver?.observe(item.el);
          }
          continue;
        }
        const rect = item.el.getBoundingClientRect();
        const viewH = window.innerHeight;
        if (rect.top > viewH + 800 || rect.bottom < -800) {
          // Re-add thumbId so observer can re-trigger later
          if (item.driveId) {
            item.el.dataset.thumbId = item.driveId;
            this._thumbObserver?.observe(item.el);
          }
          continue;
        }
      }
      this._thumbLoading++;
      this._loadThumbItem(item.driveId, item.el, item.isPreview).finally(() => {
        this._thumbLoading--;
        this._processThumbQueue();
      });
    }
  },

  // Decrypted thumbnail URL: memory cache -> local ciphertext cache -> Drive
  async _thumbUrl(driveId) {
    let url = this.thumbCache.get(driveId);
    if (url) return url;
    let plain = null;
    const hit = await ThumbDB.get(driveId);
    if (hit) {
      try { plain = await Crypto.decrypt(this.key, hit); }
      catch { plain = null; ThumbDB.del(driveId); }
    }
    if (!plain) {
      const buf = await Drive.download(driveId);
      plain = await Crypto.decrypt(this.key, buf);
      ThumbDB.put(driveId, buf);
    }
    url = this.thumbCache.get(driveId);  // another caller may have finished first
    if (url) return url;
    url = URL.createObjectURL(new Blob([plain], {type:'image/jpeg'}));
    this._setThumbCache(driveId, url);
    return url;
  },

  _fadeImg(url) {
    const img = document.createElement('img');
    img.className = 'tfade';
    img.decoding = 'async';
    img.onload = () => img.classList.add('in');
    img.src = url;
    return img;
  },

  async _loadThumbItem(driveId, el, isPreview) {
    try {
      const url = await this._thumbUrl(driveId);
      if (isPreview) {
        const img = this._fadeImg(url);
        const placeholder = el.querySelector('div:first-child');
        if (placeholder && !placeholder.classList.contains('li-badge') && !placeholder.classList.contains('li-vid')) {
          el.insertBefore(img, el.firstChild);
          placeholder.remove();
        }
      } else {
        const ph = el.querySelector('.loading-placeholder');
        if (ph) { const img = this._fadeImg(url); el.insertBefore(img, ph); ph.remove(); }
      }
    } catch {}
  },

  _setThumbCache(driveId, url) {
    if (this.thumbCache.has(driveId)) {
      this._thumbCacheOrder = this._thumbCacheOrder.filter(k => k !== driveId);
    }
    this.thumbCache.set(driveId, url);
    this._thumbCacheOrder.push(driveId);
    // Evict oldest from map (don't revoke - displayed images still need the URL)
    while (this._thumbCacheOrder.length > this.THUMB_CACHE_LIMIT) {
      const oldest = this._thumbCacheOrder.shift();
      const oldUrl = this.thumbCache.get(oldest);
      this.thumbCache.delete(oldest);
      // Release the blob unless an <img> on screen still shows it
      if (oldUrl && !document.querySelector(`img[src="${oldUrl}"]`)) { try { URL.revokeObjectURL(oldUrl); } catch {} }
    }
  },

  setGridSize(v) {
    this.gridSize = parseInt(v);
    localStorage.setItem('sg_gridSize', v);
    const grid = document.getElementById('galleryGrid');
    if (grid) grid.style.gridTemplateColumns = `repeat(auto-fill,minmax(${v}px,1fr))`;
    document.querySelectorAll('.lucky-grid').forEach(g => {
      g.style.gridTemplateColumns = `repeat(auto-fill,minmax(${v}px,1fr))`;
    });
  },

  _applyLuckyGridSize() {
    if (this.gridSize !== 160) {
      document.querySelectorAll('.lucky-grid').forEach(g => {
        g.style.gridTemplateColumns = `repeat(auto-fill,minmax(${this.gridSize}px,1fr))`;
      });
    }
  },

  // ===== LIGHTBOX =====
  async openLightbox(i) {
    this._blessVideoEls();
    this.lbIndex = i;
    document.getElementById('lightbox').classList.add('active');
    if (this._isStandalone) { document.getElementById('lightbox').classList.add('immersive'); this._showChrome(); }
    document.body.style.overflow = 'hidden';
    this._zoomOpen(i);
    this.closeSSPanel();
    if (!this._skipHistory) { this._saveScrollToHistory(); history.pushState({ view: 'lightbox' }, ''); }
    await this.showLBItem(i);
  },

  closeLightbox(skipScroll) {
    ++this._showVer;
    this.stopSlideshow(true);
    if (this.bgPreloadAbort) this.bgPreloadAbort.abort = true;
    const _ghost = (!skipScroll && !document.fullscreenElement) ? this._zoomCloseStart() : null;
    this._endZoom(true);
    this._setAmbient(null);
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    document.getElementById('lightbox').classList.remove('active');
    this._hideChrome();
    document.getElementById('lightbox').classList.remove('immersive');
    document.body.style.overflow = '';
    this._stopAllMedia();
    document.getElementById('lbContent').innerHTML = '';
    if (!skipScroll) {
      const idx = this.lbIndex;
      if (_ghost) { this.scrollToItem(idx); this._zoomBack(_ghost, idx); }
      else setTimeout(() => this.scrollToItem(idx), 50);
    }
  },

  // ===== IMMERSIVE CHROME (touch) =====
  _showChrome() {
    const lb = document.getElementById('lightbox');
    if (!lb.classList.contains('immersive')) return;
    lb.classList.add('chrome-show');
    this._armChromeTimer();
  },

  _armChromeTimer() {
    clearTimeout(this._chromeTimer);
    this._chromeTimer = setTimeout(() => {
      const ss = document.getElementById('ssPanel');
      if (ss && ss.classList.contains('open')) { this._armChromeTimer(); return; }
      document.getElementById('lightbox').classList.remove('chrome-show');
    }, 3000);
  },

  _hideChrome() {
    clearTimeout(this._chromeTimer);
    document.getElementById('lightbox').classList.remove('chrome-show');
  },

  // Create <video> elements synchronously inside the user-gesture call stack.
  // iOS unlocks audible playback per element at load()/play() call time, so these
  // stay playable even if src arrives seconds later (download + decrypt).
  _blessVideoEls() {
    this._blessedVideos = [];
    for (let k = 0; k < this.viewCount; k++) {
      const v = document.createElement('video');
      try { v.load(); } catch {}
      this._blessedVideos.push(v);
    }
  },

  async lbNav(d) {
    this._blessVideoEls();
    const step = this.viewCount > 1 ? d * this.viewCount : d;
    const n = this.lbIndex + step;
    if (n < 0 || n >= this.currentFiles.length) {
      if (this.ssRunning) this.stopSlideshow(true);
      return;
    }
    // Reset slideshow timer on manual nav (don't stop)
    if (this.ssRunning) {
      clearTimeout(this.ssTimer);
      this.ssTimer = null;
    }
    this.lbIndex = n;
    await this.showLBItem(n);
    // Restart slideshow timer from new position
    if (this.ssRunning) this.ssScheduleNext();
  },

  async showLBItem(i) {
    const ver = ++this._showVer;
    const c = document.getElementById('lbContent');

    // Stop videos IMMEDIATELY before fade wait
    this._stopAllMedia();

    // Kick off download/decrypt right away so it overlaps the fade instead of waiting behind it
    const _f0 = this.currentFiles[i];
    if (!_f0) return;
    let _mediaP;
    if (this.viewCount > 1) {
      const _files = [_f0];
      for (let n = 1; n < this.viewCount; n++) { const ef = this.currentFiles[i + n]; if (ef) _files.push(ef); }
      _mediaP = Promise.all(_files.map(file => this._makeMediaEl(file, ver)));
    } else {
      _mediaP = this._makeMediaEl(_f0, ver);
    }
    // If this request goes stale before we get to append, make sure nothing built here keeps running
    _mediaP.then(els => { if (ver !== this._showVer) this._stopEls(els); }).catch(() => {});

    // Fade out current content
    c.classList.add('fade-out');
    await new Promise(r => setTimeout(r, 150));
    if (ver !== this._showVer) return;

    c.innerHTML = '';
    const modeClass = this.viewCount === 3 ? 'triple' : this.viewCount === 2 ? 'dual' : '';
    c.className = (modeClass + ' fade-out').trim();

    const f = this.currentFiles[i];
    if (!f) return;

    if (this.viewCount > 1) {
      const extras = [];
      for (let n = 1; n < this.viewCount; n++) {
        const ef = this.currentFiles[i + n];
        if (ef) extras.push(ef);
      }
      const allFiles = [f, ...extras.filter(Boolean)];
      const namesParts = allFiles.map(file => {
        const fn = file._folderName || (this.navStack.length ? this.navStack[this.navStack.length - 1].name : '');
        const tag = fn ? `<span style="color:var(--accent)">${this.esc(fn)}</span>› ` : '';
        return tag + this.esc(file.name);
      });
      document.getElementById('lbFilename').innerHTML = namesParts.join('  |  ');
      document.getElementById('lbCounter').textContent = `${(i+1).toLocaleString()}-${(i+extras.length+1).toLocaleString()} / ${this.currentFiles.length.toLocaleString()}`;

      try {
        // Load all media elements in parallel
        const allFiles = [f, ...extras];
        const elements = await _mediaP;
        if (ver !== this._showVer) { this._stopEls(elements); return; }

        for (const el of elements) c.appendChild(el);

        requestAnimationFrame(() => { this._layoutMultiView(c); requestAnimationFrame(() => { c.classList.remove('fade-out'); this._lbShown(f); }); });
        this._playAllMedia();
        this.preloadNext(i);
      } catch(e) { if (ver === this._showVer) { c.innerHTML='<p style="color:var(--danger);">복호화 실패</p>'; c.classList.remove('fade-out'); this._lbShown(null); } }
    } else {
      const folderName = f._folderName || (this.navStack.length ? this.navStack[this.navStack.length - 1].name : '');
      const folderTag = folderName ? `<span style="color:var(--accent);margin-right:6px">${this.esc(folderName)}</span>›  ` : '';
      document.getElementById('lbFilename').innerHTML = folderTag + this.esc(f.name);
      document.getElementById('lbCounter').textContent = `${(i+1).toLocaleString()} / ${this.currentFiles.length.toLocaleString()}`;

      try {
        const el = await _mediaP;
        if (ver !== this._showVer) { this._stopEls(el); return; }
        c.appendChild(el);

        requestAnimationFrame(() => requestAnimationFrame(() => { c.classList.remove('fade-out'); this._lbShown(f); }));
        this._playAllMedia();
        this.preloadNext(i);
      } catch(e) { if (ver === this._showVer) { c.innerHTML='<p style="color:var(--danger);">복호화 실패</p>'; c.classList.remove('fade-out'); this._lbShown(null); } }
    }
  },

  async _makeMediaEl(f, _ver) {
    const wasCached = this.preloadCache.has(f.origDriveId);
    let url = this.preloadCache.get(f.origDriveId);
    // A preload for this file may already be in flight (background or intent prefetch): join it instead of downloading twice
    if (!url && this._preloadInflight.has(f.origDriveId)) {
      await this._preloadInflight.get(f.origDriveId);
      url = this.preloadCache.get(f.origDriveId);
    }
    if (!url) {
      const blob = new Blob([await Crypto.decrypt(this.key, await Drive.download(f.origDriveId))], {type:f.type});
      url = URL.createObjectURL(blob);
      this.preloadCache.set(f.origDriveId, url);
    }

    const wrap = document.createElement('div');
    wrap.className = 'lb-media-wrap';
    const timeout = wasCached ? 400 : 2000;

    if (f.type?.startsWith('video/')) {
      const video = this._blessedVideos.pop() || document.createElement('video');
      this._createdVideos.add(video);
      video.src = url;
      video.controls = !this.ssRunning;
      // Slideshow: keep native controls hidden until the user actually interacts.
      // Coordinate guard filters the synthetic mousemove Chromium fires when a new element appears under a stationary cursor.
      let _mx = null, _my = null;
      video.addEventListener('mousemove', (e) => {
        if (video.controls) return;
        if (_mx === null) { _mx = e.clientX; _my = e.clientY; return; }
        if (Math.abs(e.clientX - _mx) + Math.abs(e.clientY - _my) > 4) video.controls = true;
      });
      video.addEventListener('touchstart', () => { video.controls = true; }, { passive: true });
      video.loop = true;
      video.playsInline = true;
      video.preload = 'auto';
      video.addEventListener('ended', () => { if (this.ssRunning) this.ssAutoNext(); });
      // iOS: call play() while the user-gesture activation window is still open;
      // this also kicks WebKit into loading, so loadeddata below fires promptly.
      // Guard: skip if this request is stale or the lightbox was closed while decrypting,
      // so an orphaned (never-appended) element can't keep playing audio / holding a decoder.
      const _fresh = (_ver === undefined || _ver === this._showVer)
        && document.getElementById('lightbox').classList.contains('active');
      if (_fresh) video.play().catch(() => {});
      await new Promise(r => { video.onloadeddata = r; setTimeout(r, timeout); });
      wrap.appendChild(video);
    } else {
      const img = document.createElement('img');
      img.src = url;
      await new Promise(r => { img.onload = r; setTimeout(r, timeout); });
      // Wrap in kb-clip for Ken Burns clipping
      const clip = document.createElement('div');
      clip.className = 'kb-clip';
      clip.appendChild(img);
      wrap.appendChild(clip);
    }

    // Heart button (SVG for cross-platform consistency)
    const heart = document.createElement('div');
    heart.className = 'lb-fav-btn' + (this.favSet.has(f.origDriveId) ? ' active' : '');
    heart.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
    heart.onclick = (e) => { e.stopPropagation(); this.toggleFavorite(f, heart); };
    heart.addEventListener('touchend', (e) => {
      e.stopPropagation();
      e.preventDefault();
      this.toggleFavorite(f, heart);
    });
    wrap.appendChild(heart);

    // Go to folder button (only show when file has folder info)
    if (f._folderId) {
      const goBtn = document.createElement('div');
      goBtn.className = 'lb-goto-btn';
      goBtn.title = f._folderName || '폴더로 이동';
      goBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
      goBtn.onclick = (e) => { e.stopPropagation(); this.goToFileFolder(f); };
      goBtn.addEventListener('touchend', (e) => { e.stopPropagation(); e.preventDefault(); this.goToFileFolder(f); });
      wrap.appendChild(goBtn);
    }

    // Heart animation element
    const heartAnim = document.createElement('div');
    heartAnim.className = 'lb-heart-anim';
    heartAnim.innerHTML = '<svg width="60" height="60" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
    wrap.appendChild(heartAnim);

    // Fav toast inside this wrap
    const favToast = document.createElement('div');
    favToast.className = 'lb-fav-toast';
    wrap.appendChild(favToast);

    // Position heart and goto button over actual image area (not letterbox)
    const media = wrap.querySelector('img, video');
    const goBtn = wrap.querySelector('.lb-goto-btn');
    const clip = wrap.querySelector('.kb-clip');
    const positionHeart = () => {
      if (!media || !wrap.offsetHeight) return;
      const cw = wrap.offsetWidth, ch = wrap.offsetHeight;
      const nw = media.naturalWidth || media.videoWidth || cw;
      const nh = media.naturalHeight || media.videoHeight || ch;
      if (!nw || !nh) return;
      const scale = Math.min(cw / nw, ch / nh);
      const rw = nw * scale, rh = nh * scale;
      const offTop = (ch - rh) / 2, offLeft = (cw - rw) / 2;
      // Videos in iOS standalone web app: drop below the native controls' top strip (fullscreen/PiP triggers live there)
      const topPad = (f.type?.startsWith('video/') && this._isStandalone) ? 62 : 10;
      heart.style.top = (offTop + topPad) + 'px';
      heart.style.left = (offLeft + 10) + 'px';
      if (goBtn) {
        goBtn.style.top = (offTop + topPad) + 'px';
        goBtn.style.left = (offLeft + 48) + 'px';
      }
      // Size kb-clip to match rendered image area
      if (clip) {
        clip.style.width = Math.round(rw) + 'px';
        clip.style.height = Math.round(rh) + 'px';
        clip.style.top = Math.round(offTop) + 'px';
        clip.style.left = Math.round(offLeft) + 'px';
      }
    };
    requestAnimationFrame(() => requestAnimationFrame(positionHeart));
    new ResizeObserver(positionHeart).observe(wrap);

    // Double-click to toggle favorite
    const doFavToggle = () => {
      this.toggleFavorite(f, heart);
    };

    // Desktop: dblclick to toggle favorite (images only, videos use heart button)
    wrap.addEventListener('dblclick', (e) => {
      if (e.target.closest('.lb-fav-btn') || e.target.closest('.lb-goto-btn') || e.target.closest('video')) return;
      e.preventDefault();
      doFavToggle();
    });

    // Mobile: double-tap detection (images only)
    let lastTap = 0;
    wrap.addEventListener('touchend', (e) => {
      if (e.target.closest('.lb-fav-btn') || e.target.closest('.lb-goto-btn') || e.target.closest('video')) return;
      const now = Date.now();
      if (now - lastTap < 300) { e.preventDefault(); doFavToggle(); lastTap = 0; }
      else { lastTap = now; }
    });

    return wrap;
  },

  async preloadNext(currentIndex) {
    const range = this._isMobile ? Math.min(this.viewCount * 2, 2) : this.viewCount * 4;
    const promises = [];
    for (let offset = 1; offset <= range; offset++) {
      for (const idx of [currentIndex + offset, currentIndex - offset]) {
        if (idx < 0 || idx >= this.currentFiles.length) continue;
        const nf = this.currentFiles[idx];
        if (this.preloadCache.has(nf.origDriveId)) continue;
        promises.push(this._preloadOne(nf));
      }
    }
    Promise.all(promises).catch(() => {});
    this.startBgPreload(currentIndex);
  },

  _preloadInflight: new Map(),   // origDriveId -> promise (shared by preloaders and the click path)
  _preloadOne(f) {
    if (this.preloadCache.has(f.origDriveId)) return Promise.resolve();
    if (this._preloadInflight.has(f.origDriveId)) return this._preloadInflight.get(f.origDriveId);
    const p = (async () => {
      try {
        const blob = new Blob([await Crypto.decrypt(this.key, await Drive.download(f.origDriveId))], {type:f.type});
        if (!this.preloadCache.has(f.origDriveId)) this.preloadCache.set(f.origDriveId, URL.createObjectURL(blob));
      } catch {}
      finally { this._preloadInflight.delete(f.origDriveId); }
    })();
    this._preloadInflight.set(f.origDriveId, p);
    return p;
  },

  // Prefetch on intent (hover / touchstart on a video thumbnail): the click then starts closer to playback.
  _intentInflight: 0,
  _intentPrefetch(f) {
    if (!f || this.preloadCache.has(f.origDriveId) || this._preloadInflight.has(f.origDriveId)) return;
    if (this._intentInflight >= 2 || this.preloadCache.size >= this.PRELOAD_CACHE_LIMIT) return;
    this._intentInflight++;
    this._preloadOne(f).finally(() => { this._intentInflight--; });
  },

  startBgPreload(centerIndex) {
    if (this.bgPreloadAbort) this.bgPreloadAbort.abort = true;
    const ctrl = { abort: false };
    this.bgPreloadAbort = ctrl;

    const startOffset = (this._isMobile ? 3 : 5) + 1;
    const bgConcurrency = this._isMobile ? 1 : 3;
    const queue = [];
    for (let offset = startOffset; offset < this.currentFiles.length; offset++) {
      if (queue.length >= this.PRELOAD_CACHE_LIMIT) break;
      const fwd = centerIndex + offset;
      const bwd = centerIndex - offset;
      if (fwd < this.currentFiles.length) queue.push(fwd);
      if (bwd >= 0) queue.push(bwd);
    }

    (async () => {
      for (let i = 0; i < queue.length; i += bgConcurrency) {
        if (ctrl.abort) return;
        if (this.preloadCache.size >= this.PRELOAD_CACHE_LIMIT) return;
        const batch = queue.slice(i, i + bgConcurrency).map(idx => {
          const f = this.currentFiles[idx];
          if (!f || this.preloadCache.has(f.origDriveId)) return Promise.resolve();
          return this._preloadOne(f);
        });
        await Promise.all(batch);
      }
    })();
  },

  startSlideshow() {

    document.getElementById('lbSSBtn').title = '정지';
    const orderLabel = this.ssOrder === 'random' ? '랜덤' : '순차';
    const kbLabel = this.ssKenBurns ? ' · 확대' : '';
    this.showHud(SGI.hudPlay, '슬라이드쇼', `${orderLabel} · ${this.ssInterval}초${kbLabel}`);
    this._applyKenBurns();
    this.ssScheduleNext();
  },

  _applyKenBurns() {
    const wraps = document.querySelectorAll('#lbContent .lb-media-wrap');
    wraps.forEach(w => {
      if (this.ssRunning && this.ssKenBurns) {
        w.classList.add('ken-burns');
      } else {
        w.classList.remove('ken-burns');
      }
    });
  },

  stopSlideshow(silent) {
    if (!this.ssRunning) return;
    this.ssRunning = false;
    clearTimeout(this.ssTimer);
    this.ssTimer = null;
    const btn = document.getElementById('lbSSBtn');
    if (btn) { btn.classList.remove('active'); btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>'; btn.title = '슬라이드쇼'; }
    const video = document.querySelector('#lbContent video');
    if (video) video.loop = true;
    document.querySelectorAll('#lbContent video').forEach(v => { v.controls = true; });
    this._applyKenBurns();
    if (!silent) this.showHud(SGI.hudPause, '일시정지', '');
  },

  ssScheduleNext() {
    if (!this.ssRunning) return;
    // Always clear previous timer to prevent duplicates
    clearTimeout(this.ssTimer);
    this.ssTimer = null;
    this._applyKenBurns();
    const f = this.currentFiles[this.lbIndex];

    // For videos: disable loop, wait for 'ended' event
    if (f?.type?.startsWith('video/')) {
      const video = document.querySelector('#lbContent video');
      if (video) video.loop = false;
      return; // 'ended' event will call ssAutoNext
    }

    // For images: use timer
    this.ssTimer = setTimeout(() => {
      if (!this.ssRunning) return;
      this.ssAutoNext();
    }, this.ssInterval * 1000);
  },

  ssAutoNext() {
    if (!this.ssRunning) return;
    let next;
    if (this.ssOrder === 'random') {
      if (this.currentFiles.length > 1) {
        do { next = Math.floor(Math.random() * this.currentFiles.length); }
        while (next === this.lbIndex);
      } else { next = 0; }
    } else {
      const step = this.viewCount;
      next = this.lbIndex + step;
      if (next >= this.currentFiles.length) next = 0;
    }
    this.lbIndex = next;
    this.showLBItem(next).then(() => this.ssScheduleNext());
  },

      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';

  // ===== VIEW COUNT =====
  setViewCount(n) {
    this.viewCount = n;
    this._blessVideoEls();
    document.querySelectorAll('.lb-view-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.getElementById(`lbView${n}`);

    if (n > 1 && this.lbIndex % n !== 0) {

  // ===== SHARED FOLDER SCAN =====
  // One memoized, batched-parallel walk of the folder tree, shared by 추천 and Random 1000
  // (previously each did its own sequential N+M Drive round-trips, duplicating every call).
  _scanPromise: null,
  _scanDone: false,
  _scanListeners: [],
  _scanAllFolders(onProgress) {
    if (this._scanPromise) {
      // In flight: attach for progress. Already done: report complete immediately.
      if (onProgress) { if (this._scanDone) { try { onProgress(1); } catch {} } else this._scanListeners.push(onProgress); }
      return this._scanPromise;
    }
    if (onProgress) this._scanListeners.push(onProgress);
    const emit = p => { for (const fn of this._scanListeners) { try { fn(p); } catch {} } };
    const listChildren = async id => {
      if (!this.treeCache[id]) this.treeCache[id] = await Drive.listFolders(id);
      return this.treeCache[id];
    };
    this._scanPromise = (async () => {
      const allFolders = [];
      const rootChildren = await listChildren(this.rootDriveId);
      const topFolders = rootChildren.filter(f => f.name !== 'index' && f.name !== 'thumbs' && f.name !== 'files');
      const BATCH = 8;
      for (let i = 0; i < topFolders.length; i += BATCH) {
        const slice = topFolders.slice(i, i + BATCH);
        const kids = await Promise.all(slice.map(t => listChildren(t.id).catch(() => [])));
        for (let k = 0; k < slice.length; k++) {
          allFolders.push(slice[k]);
          const children = kids[k];
          const grand = await Promise.all(children.map(s => listChildren(s.id).catch(() => [])));
          children.forEach((sub, j) => { allFolders.push(sub); for (const ss of grand[j]) allFolders.push(ss); });
        }
        emit(Math.min(1, (i + slice.length) / topFolders.length));
      }
      return allFolders;
    })();
    this._scanPromise.then(
      () => { this._scanDone = true; this._scanListeners = []; },
      () => { this._scanPromise = null; this._scanListeners = []; }   // allow retry after failure
    );
    return this._scanPromise;
  },

  // ===== LUCKY PICKS =====
  async loadLuckyPicks(force) {
    const area = document.getElementById('luckyArea');
    if (!area) return;

    const today = new Date().toDateString();

    // 1. Memory cache (same session)
    if (!force && this._luckyCache && this._luckyDate === today) {
      this._renderLuckyFromCache(area);
      return;
    }

    // 2. localStorage cache (across refreshes)
    if (!force) {
      try {
        const stored = localStorage.getItem('sg_lucky');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed.date === today) {
            this._luckyCache = { images: parsed.images, videos: parsed.videos };
            this._luckyDate = today;
            this._renderLuckyFromCache(area);
            return;
          }
        }
      } catch {}
    }

    // 3. Fresh scan
    area.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
      <span style="color:var(--text2);font-size:13px;" id="luckyStatus">폴더 스캔 중...</span>
      <div style="flex:1;max-width:200px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden">
        <div id="luckyBar" style="height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width 0.2s"></div>
      </div>
    </div>`;
    const bar = document.getElementById('luckyBar');
    const status = document.getElementById('luckyStatus');

    let allFolders = [];
    try {
      allFolders = await this._scanAllFolders(p => { if (bar) bar.style.width = Math.round(p * 50) + '%'; });
    } catch (e) { console.error('Lucky scan error:', e); }

    if (allFolders.length === 0) { area.innerHTML = ''; return; }

    if (status) status.textContent = '추천 선별 중...';
    if (bar) bar.style.width = '50%';

    const filtered = allFolders.filter(f => f.name !== 'RIFE');
    const videoFolders = filtered.filter(f => f.name === '1.Landscape' || f.name === '2.Portrait' || f.name === '3.Longform');
    const otherFolders = filtered.filter(f => f.name !== '1.Landscape' && f.name !== '2.Portrait' && f.name !== '3.Longform');
    for (let i = otherFolders.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [otherFolders[i], otherFolders[j]] = [otherFolders[j], otherFolders[i]];
    }
    const shuffled = [...videoFolders, ...otherFolders.slice(0, 20 - videoFolders.length)];
    const allImages = [];
    const allVideos = [];
    let loaded = 0;

    const results = await Promise.allSettled(shuffled.map(async folder => {
      const indexId = await Drive.findFile('_index.enc', folder.id);
      if (!indexId) { loaded++; return []; }
      const files = await Crypto.decryptJSON(this.key, await Drive.download(indexId));
      loaded++;
      if (bar) bar.style.width = Math.round(50 + (loaded / shuffled.length) * 50) + '%';
      return files.filter(f => !this.hiddenSet.has(f.origDriveId)).map(f => ({ ...f, _folderId: folder.id, _folderName: folder.name }));
    }));

    for (const r of results) {
      if (r.status !== 'fulfilled') continue;
      for (const entry of r.value) {
        if (entry.type?.startsWith('video/')) allVideos.push(entry);
        else allImages.push(entry);
      }
    }

    const pickRandom = (arr, n) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a.slice(0, n);
    };
    const pickedImages = pickRandom(allImages, 20);
    const pickedVideos = pickRandom(allVideos, 20);

    this._luckyCache = { images: pickedImages, videos: pickedVideos };
    this._luckyDate = today;

    // Save to localStorage
    try { localStorage.setItem('sg_lucky', JSON.stringify({ date: today, images: pickedImages, videos: pickedVideos })); } catch {}

    this._renderLuckyFromCache(area);
  },

  _renderLuckyFromCache(area) {
    const { images, videos } = this._luckyCache;
    let h = '';
    if (images.length > 0) {
      h += `<div class="lucky-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="stroke:var(--text2)" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg> 추천 사진</div>`;
      h += `<div class="lucky-grid" id="luckyImgGrid"></div>`;
    }
    if (videos.length > 0) {
      h += `<div class="lucky-label" style="margin-top:20px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="stroke:var(--text2)" stroke-width="2" stroke-linecap="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> 추천 영상</div>`;
      h += `<div class="lucky-grid" id="luckyVidGrid"></div>`;
    }
    if (!images.length && !videos.length) {
      h = '<div style="color:var(--text2);font-size:13px;">추천할 파일이 없습니다.</div>';
    }
    area.innerHTML = h;
    // Interleave image and video thumb loading so both sections appear together
    const imgEls = [], vidEls = [];
    this._renderLuckyItems('luckyImgGrid', images, false, imgEls);
    this._renderLuckyItems('luckyVidGrid', videos, true, vidEls);
    const maxLen = Math.max(imgEls.length, vidEls.length);
    for (let i = 0; i < maxLen; i++) {
      if (imgEls[i]) this.loadThumbInto(imgEls[i].driveId, imgEls[i].el);
      if (vidEls[i]) this.loadThumbInto(vidEls[i].driveId, vidEls[i].el);
    }
    this._applyLuckyGridSize();
  },

  _renderLuckyItems(gridId, items, isVideo, thumbQueue) {
    const grid = document.getElementById(gridId);
    if (!grid || !items.length) return;

    for (const item of items) {
      const el = document.createElement('div');
      el.className = 'lucky-item';
      el.innerHTML = `<div style="width:100%;height:100%;background:var(--surface2);display:flex;align-items:center;justify-content:center;"><div class="spinner"></div></div>`;
      if (isVideo) el.innerHTML += `<div class="li-vid">${SGI.play}</div>`;
      if (this.favSet.has(item.origDriveId)) el.innerHTML += `<div class="fav-badge">${SGI.heart}</div>`;
      el.innerHTML += `<div class="li-badge">${this.esc(item._folderName)}</div>`;

      el.onclick = () => this.openLuckyItem(item);
      grid.appendChild(el);

      // Queue thumbnail for interleaved loading
      if (item.thumbDriveId) {
        if (thumbQueue) thumbQueue.push({ driveId: item.thumbDriveId, el });
        else this.loadThumbInto(item.thumbDriveId, el);
      }
    }
  },

  // ===== RANDOM 1000 =====
  async loadRandom1000(force) {
    const area = document.getElementById('r1000Area');
    if (!area) return;

    const today = new Date().toDateString();

    if (!force && this._r1000Cache && this._r1000Date === today) {
      this._renderR1000Preview(area);
      return;
    }

    if (!force) {
      try {
        const stored = localStorage.getItem('sg_r1000');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed.date === today) {
            this._r1000Cache = parsed.items;
            this._r1000Date = today;
            this._renderR1000Preview(area);
            return;
          }
        }
      } catch {}
    }

    area.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
      <span style="color:var(--text2);font-size:13px;" id="r1000Status">폴더 스캔 중...</span>
      <div style="flex:1;max-width:200px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden">
        <div id="r1000Bar" style="height:100%;width:0%;background:var(--accent);border-radius:2px;transition:width 0.2s"></div>
      </div>
    </div>`;
    const bar = document.getElementById('r1000Bar');
    const status = document.getElementById('r1000Status');

    // Scan all folders
    let allFolders = [];
    try {
      allFolders = await this._scanAllFolders(p => { if (bar) bar.style.width = Math.round(p * 30) + '%'; });
    } catch (e) { console.error('R1000 scan error:', e); }

    if (allFolders.length === 0) { area.innerHTML = ''; return; }

    if (status) status.textContent = '인덱스 로딩 중...';
    if (bar) bar.style.width = '30%';

    // Always include video-likely folders, then fill with random
    const filtered = allFolders.filter(f => f.name !== 'RIFE');
    const videoFolders = filtered.filter(f => f.name === '1.Landscape' || f.name === '2.Portrait' || f.name === '3.Longform');
    const otherFolders = filtered.filter(f => f.name !== '1.Landscape' && f.name !== '2.Portrait' && f.name !== '3.Longform');
    const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
    const picked = [...videoFolders, ...shuffle(otherFolders).slice(0, 58)];
    const allImages = [];
    const allVideos = [];
    let loaded = 0;

    const results = await Promise.allSettled(picked.map(async folder => {
      const indexId = await Drive.findFile('_index.enc', folder.id);
      if (!indexId) { loaded++; return []; }
      const files = await Crypto.decryptJSON(this.key, await Drive.download(indexId));
      loaded++;
      if (bar) bar.style.width = Math.round(30 + (loaded / picked.length) * 70) + '%';
      return files.filter(f => !this.hiddenSet.has(f.origDriveId)).map(f => ({ ...f, _folderId: folder.id, _folderName: folder.name }));
    }));

    for (const r of results) {
      if (r.status !== 'fulfilled') continue;
      for (const entry of r.value) {
        if (entry.type?.startsWith('video/')) allVideos.push(entry);
        else allImages.push(entry);
      }
    }

    // Fisher-Yates shuffle and pick
    const pickedImages = shuffle(allImages).slice(0, 600);
    const pickedVideos = shuffle(allVideos).slice(0, 400);

    // Interleave: mix images and videos randomly
    const combined = shuffle([...pickedImages, ...pickedVideos]);

    this._r1000Cache = combined;
    this._r1000Date = today;

    try { localStorage.setItem('sg_r1000', JSON.stringify({ date: today, items: combined })); } catch {}

    this._renderR1000Preview(area);
  },

  _renderR1000Preview(area) {
    const items = this._r1000Cache;
    if (!items || !items.length) { area.innerHTML = '<div style="color:var(--text2);font-size:13px;">데이터 없음</div>'; return; }
    const imgCount = items.filter(f => !f.type?.startsWith('video/')).length;
    const vidCount = items.length - imgCount;
    area.innerHTML = `<div style="color:var(--text2);font-size:12px;margin-bottom:8px;">사진 ${imgCount}개 + 영상 ${vidCount}개</div><div class="lucky-grid" id="r1000Grid"></div>`;
    const grid = document.getElementById('r1000Grid');
    if (!grid) return;

    const previewSlice = items.slice(0, 10);
    for (const item of previewSlice) {
      const el = document.createElement('div');
      el.className = 'lucky-item';
      el.innerHTML = `<div style="width:100%;height:100%;background:var(--surface2);display:flex;align-items:center;justify-content:center;"><div class="spinner"></div></div>`;
      if (item.type?.startsWith('video/')) el.innerHTML += `<div class="li-vid">${SGI.play}</div>`;
      el.innerHTML += `<div class="li-badge">${this.esc(item._folderName || '')}</div>`;
      el.onclick = () => this.openRandom1000();
      grid.appendChild(el);
      if (item.thumbDriveId) this.loadThumbInto(item.thumbDriveId, el);
    }
    this._applyLuckyGridSize();
  },

  async _resolveMergedIds() {
    if (this._mergedIds) return this._mergedIds;
    try {
      const rootFolders = await Drive.listFolders(this.rootDriveId);
      const mov = rootFolders.find(f => f.name === '0_MOV');
      if (!mov) return null;
      const kids = await Drive.listFolders(mov.id);
      const ls = kids.find(f => f.name === '1.Landscape');
      const pt = kids.find(f => f.name === '2.Portrait');
      const lf = kids.find(f => f.name === '3.Longform');
      if (!ls || !pt || !lf) return null;
      this._mergedIds = { lsId: ls.id, ptId: pt.id, lfId: lf.id };
      return this._mergedIds;
    } catch { return null; }
  },

  async openMergedWide(lsId, ptId, lfId) {
    if (lsId && ptId && lfId) this._mergedIds = { lsId, ptId, lfId };

    this._favMode = false;
    this._trashMode = false;
    this.navStack = [{ id: '__mergedwide__', name: 'All video' }];
    this.currentFolderId = '__mergedwide__';

    this.stopSlideshow(true);
    if (this.bgPreloadAbort) this.bgPreloadAbort.abort = true;
    this.preloadCache.forEach(u => URL.revokeObjectURL(u));
    this.preloadCache.clear();
    this._thumbQueue = [];
    this.shuffled = false;
    this.selectedSet.clear(); this._lastSelectedIdx = -1;
    this.originalFiles = [];
    this._currentSort = 'date_desc';
    this._favFilter = 'all';
    this._orientFilter = 'all';
    this._favStatusFilter = 'all';
    this._folderFilesCache = null;
    this._monthFilters.clear();
    const _mwChip = document.getElementById('monthFilterChip'); if (_mwChip) _mwChip.remove();
    const _mwPanel = document.getElementById('monthPickerPanel'); if (_mwPanel) _mwPanel.classList.remove('open');
    const _mwBtn = document.getElementById('monthPickerBtn'); if (_mwBtn) { _mwBtn.classList.remove('active'); _mwBtn.classList.remove('filtered'); }

    this.showScreen('mainScreen');
    this.renderBreadcrumb();
    if (!this._skipHistory) { this._saveScrollToHistory(); history.pushState({ view: 'mergedwide' }, ''); }

    const area = document.getElementById('contentArea');
    const toolbar = document.getElementById('toolbar');
    toolbar.style.display = 'none';
    area.innerHTML = `<div class="empty-state"><div class="spinner"></div></div>`;

    try {
      const ids = await this._resolveMergedIds();
      if (!ids) { area.innerHTML = `<div class="empty-state">1.Landscape / 2.Portrait / 3.Longform 폴더를 찾을 수 없습니다.</div>`; return; }
      const parts = await Promise.all([
        { fid: ids.lsId, fname: '1.Landscape' },
        { fid: ids.ptId, fname: '2.Portrait' },
        { fid: ids.lfId, fname: '3.Longform' }
      ].map(async ({ fid, fname }) => {
        const indexId = await Drive.findFile('_index.enc', fid);
        if (!indexId) return [];
        const files = await Crypto.decryptJSON(this.key, await Drive.download(indexId));
        return files.filter(f => !this.hiddenSet.has(f.origDriveId)).map(f => ({ ...f, _folderId: fid, _folderName: fname }));
      }));
      const merged = [...parts[0], ...parts[1], ...parts[2]];
      merged.sort((a, b) => {
        const at = a.mtime || 0, bt = b.mtime || 0;
        if (!at && !bt) return 0;
        if (!at) return 1;
        if (!bt) return -1;
        return bt - at;
      });
      this.currentFiles = merged;
      this.originalFiles = [...merged];
      this._folderFilesCache = [...merged];

      toolbar.style.display = 'flex';
      this._updateFileCount();
      const nameArrow = document.getElementById('sortNameArrow');
      const dateArrow = document.getElementById('sortDateArrow');
      if (nameArrow) nameArrow.textContent = '↑';
      if (dateArrow) dateArrow.textContent = '↓';

      let filterDiv = document.getElementById('favFilterDiv');
      if (!filterDiv) {
        filterDiv = document.createElement('div');
        filterDiv.id = 'favFilterDiv';
        filterDiv.className = 'fav-filter';
        filterDiv.innerHTML = this._getFilterHTML(true);
        toolbar.insertBefore(filterDiv, toolbar.querySelector('.spacer'));
      } else {
        filterDiv.style.display = 'flex';
        filterDiv.innerHTML = this._getFilterHTML(true);
      }

      area.innerHTML = `<div class="gallery-grid" id="galleryGrid" style="grid-template-columns:repeat(auto-fill,minmax(${this.gridSize}px,1fr))"></div>`;
      this.renderGallery();
      this._updateFilterIndicator();
    } catch (e) {
      console.error(e);
      area.innerHTML = `<div class="empty-state">❌ ${this.esc(e.message)}</div>`;
    }
  },
