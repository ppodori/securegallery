  async loadThumbInto(driveId, el) {
    if (!driveId) return;
    this._thumbQueue.push({ driveId, el, isPreview: true });
    this._processThumbQueue();
  },

  async openLuckyItem(item) {
    // Navigate to the folder, then open the file in lightbox
    const stack = this._buildNavStack(item._folderId, this.rootDriveId);
    this.navStack = stack;
    await this.navTo(item._folderId, item._folderName);

    // Find file index in currentFiles
    const idx = this.currentFiles.findIndex(f => f.origDriveId === item.origDriveId);
    if (idx >= 0) {
      await this.openLightbox(idx);
    }
  },

  async goToFileFolder(f) {
    if (!f._folderId) return;
    this.closeLightbox(true);
    const stack = this._buildNavStack(f._folderId, this.rootDriveId);
    this.navStack = stack;
    await this.navTo(f._folderId, f._folderName);
    // Scroll to the file in grid
    const idx = this.currentFiles.findIndex(item => item.origDriveId === f.origDriveId);
    if (idx >= 0) {
      this.scrollToItem(idx);
    }
  },

  // ===== HUD =====
  _hudTimer: null,
  showHud(icon, title, sub) {
    const hud = document.getElementById('lbHud');
    if (!hud) return;
    hud.innerHTML = `<div class="hud-icon">${icon}</div><div class="hud-title">${title}</div>${sub ? `<div class="hud-sub">${sub}</div>` : ''}`;
    hud.classList.add('show');
    clearTimeout(this._hudTimer);
    this._hudTimer = setTimeout(() => hud.classList.remove('show'), 1200);
  },

  // ===== HELPERS =====
  // Stop videos inside elements that were built but will never be shown (stale ver)
  _stopEls(els) {
    (Array.isArray(els) ? els : [els]).forEach(el => {
      if (!el || !el.querySelectorAll) return;
      el.querySelectorAll('video').forEach(v => { try { v.pause(); v.removeAttribute('src'); v.load(); } catch {} });
    });
  },

  _stopAllMedia() {
    // Stop DOM videos
    document.querySelectorAll('#lbContent video').forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
    // Stop any orphan videos (created but not appended to DOM)
    this._createdVideos.forEach(v => { try { v.pause(); v.removeAttribute('src'); v.load(); } catch {} });
    this._createdVideos.clear();
  },

  _playAllMedia() {
    document.querySelectorAll('#lbContent video').forEach(v => v.play().catch(() => {
      // Autoplay blocked (activation window expired): resume on the next tap/click
      const resume = () => {
        v.play().catch(() => {});
        document.removeEventListener('touchend', resume);
        document.removeEventListener('click', resume);
      };
      document.addEventListener('touchend', resume);
      document.addEventListener('click', resume);
    }));
  },

  _layoutMultiView(c) {
    if (this.viewCount <= 1) return;
    const wraps = c.querySelectorAll('.lb-media-wrap');
    if (!wraps.length) return;
    const ch = c.offsetHeight;
    const cw = c.offsetWidth;
    const gap = this.viewCount === 2 ? 4 : 3;
    const availW = cw - gap * (wraps.length - 1);

    let totalNatW = 0;
    const natWidths = [];
    wraps.forEach(wrap => {
      const media = wrap.querySelector('img, video');
      const nw = media.naturalWidth || media.videoWidth || 1;
      const nh = media.naturalHeight || media.videoHeight || 1;
      const natW = ch * (nw / nh);
      natWidths.push(natW);
      totalNatW += natW;
    });

    const scale = Math.min(1, availW / totalNatW);
    wraps.forEach((wrap, i) => {
      wrap.style.flex = 'none';
      wrap.style.width = Math.floor(natWidths[i] * scale) + 'px';
    });
  },

  scrollToItem(idx) {
    const grid = document.getElementById('galleryGrid');
    if (!grid) return;

    // Already loaded — just scroll
    if (idx < this._galleryLoaded) {
      const item = grid.querySelector(`[data-idx="${idx}"]`);
      if (item) requestAnimationFrame(() => item.scrollIntoView({ block: 'center', behavior: 'instant' }));
      return;
    }

    // Small gap (< 300) — load batches normally
    if (idx < this._galleryLoaded + 300) {
      while (idx >= this._galleryLoaded && this._galleryLoaded < this.currentFiles.length) {
        this._galleryLoadBatch();
      }
      const item = grid.querySelector(`[data-idx="${idx}"]`);
      if (item) requestAnimationFrame(() => item.scrollIntoView({ block: 'center', behavior: 'instant' }));
      return;
    }

    // Large jump — spacer approach
    this._jumpToItem(idx);
  },

  _jumpToItem(idx) {
    const grid = document.getElementById('galleryGrid');
    if (!grid) return;

    // Clear everything
    grid.innerHTML = '';
    this._thumbQueue = [];
    this._lastRenderedMonth = null;
    this._lastRenderedWeek = null;

    const buffer = this._isMobile ? 50 : 100;
    const BATCH = this._isMobile ? 30 : 50;
    const startIdx = Math.max(0, idx - buffer);

    // Track spacer range
    this._spacerEndIdx = startIdx; // items 0..(startIdx-1) are in spacer

    // Calculate spacer height for skipped items
    if (startIdx > 0) {
      const gap = 1;
      const cols = Math.max(1, Math.floor((grid.clientWidth + gap) / (this.gridSize + gap)));
      const rowH = this.gridSize + gap;
      const skipRows = Math.ceil(startIdx / cols);
      const spacer = document.createElement('div');
      spacer.className = 'grid-spacer';
      spacer.style.cssText = `grid-column:1/-1;height:${skipRows * rowH}px`;
      grid.appendChild(spacer);

      // Observer: when spacer becomes visible, load items upward
      this._spacerObs = new IntersectionObserver(entries => {
        if (!entries[0].isIntersecting) return;
        this._loadUpward();
      }, { root: document.getElementById('contentScroll'), rootMargin: '200px' });
      this._spacerObs.observe(spacer);
    }

    // Load items from startIdx onward
    this._galleryLoaded = startIdx;
    const targetEnd = Math.min(idx + buffer, this.currentFiles.length);
    while (this._galleryLoaded < targetEnd && this._galleryLoaded < this.currentFiles.length) {
      this._galleryLoadBatch();
    }

    // Scroll to target
    const item = grid.querySelector(`[data-idx="${idx}"]`);
    if (item) requestAnimationFrame(() => item.scrollIntoView({ block: 'center', behavior: 'instant' }));
  },

  _loadUpward() {
    const grid = document.getElementById('galleryGrid');
    const spacer = grid?.querySelector('.grid-spacer');
    if (!spacer || this._spacerEndIdx <= 0) return;

    const BATCH = this._isMobile ? 30 : 50;
    const gap = 1;
    const cols = Math.max(1, Math.floor((grid.clientWidth + gap) / (this.gridSize + gap)));
    const rowH = this.gridSize + gap;

    // Load one batch upward
    const loadFrom = Math.max(0, this._spacerEndIdx - BATCH);
    const loadTo = this._spacerEndIdx;

    const frag = document.createDocumentFragment();
    const toObserve = [];
    const showDateSep = this._currentSort === 'date_asc' || this._currentSort === 'date_desc';
    let prevMonth = null, prevWeek = null;
    for (let i = loadFrom; i < loadTo; i++) {
      const file = this.currentFiles[i];
      if (!file) continue;
      // Date separator (month + collapsible week)
      let _mKey = null, _wKey = null;
      if (showDateSep && file.mtime) {
        const d = new Date(file.mtime);
        _mKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        _wKey = `${_mKey}-W${Math.ceil(d.getDate()/7)}`;
        if (_mKey !== prevMonth) {
          prevMonth = _mKey;
          prevWeek = null;
          const mk = _mKey;
          const sep = document.createElement('div');
          sep.className = 'date-sep' + (this._collapsedKeys.has(mk) ? ' collapsed' : '');
          sep.dataset.month = mk;
          sep.onclick = (e) => { if (e.target.closest('.sep-chev')) this.toggleSection(mk); };
          sep.innerHTML = `<span class="sep-chev">${SGI.chev}</span>${d.getFullYear()}년 ${d.getMonth()+1}월`;
          frag.appendChild(sep);
        }
        if (_wKey !== prevWeek) {
          prevWeek = _wKey;
          const mk = _mKey, wk = _wKey;
          const wsep = document.createElement('div');
          wsep.className = 'week-sep' + (this._collapsedKeys.has(wk) ? ' collapsed' : '');
          wsep.dataset.month = mk;
          wsep.dataset.week = wk;
          if (this._collapsedKeys.has(mk)) wsep.style.display = 'none';
          wsep.onclick = (e) => { if (e.target.closest('.sep-chev')) this.toggleSection(wk); };
          wsep.innerHTML = `<span class="sep-chev">${SGI.chev}</span>${Math.ceil(d.getDate()/7)}주차`;
          frag.appendChild(wsep);
        }
      }
      const el = document.createElement('div');
      el.className = 'gallery-item';
      el.dataset.idx = i;
      if (_mKey) {
        el.dataset.month = _mKey;
        el.dataset.week = _wKey;
        if (this._collapsedKeys.has(_mKey) || this._collapsedKeys.has(_wKey)) el.style.display = 'none';
      }
      el.onclick = (e) => {
        if (e.target.closest('.sel-check')) return;
        this.openLightbox(i);
      };
      const cached = this.thumbCache.get(file.thumbDriveId);
      let ih = cached ? `<img src="${cached}" decoding="async">` : `<div class="loading-placeholder"><div class="spinner"></div></div>`;
      if (file.type?.startsWith('video/')) ih += `<div class="vid-badge">${SGI.play}</div>`;
      if (this.favSet.has(file.origDriveId)) ih += `<div class="fav-badge">${SGI.heart}</div>`;
      const dateStr = file.mtime ? new Date(file.mtime).toISOString().slice(0, 10) : '';
      if (dateStr) ih += `<div class="hover-info"><div class="hi-date">${dateStr}</div></div>`;
      ih += `<div class="sel-check" onclick="event.stopPropagation();app.toggleSelect(${i},event.shiftKey)"></div>`;
      el.innerHTML = ih;
      if (!cached) { el.dataset.thumbId = file.thumbDriveId; toObserve.push(el); }
      frag.appendChild(el);
    }

    // Insert after spacer (before existing items)
    spacer.after(frag);
    for (const el of toObserve) this._thumbObserver.observe(el);

    // Remove duplicate date separator between upward batch and existing items
    if (showDateSep && prevMonth) {
      // Find the first existing element after our inserted items
      const allItems = grid.querySelectorAll('.gallery-item');
      for (const node of allItems) {
        if (parseInt(node.dataset.idx) >= loadTo) {
          // Collect separators sitting right above the first existing item,
          // remove those duplicating what this upward batch just rendered
          const seps = [];
          let prev = node.previousElementSibling;
          while (prev && (prev.classList.contains('date-sep') || prev.classList.contains('week-sep'))) {
            seps.push(prev);
            prev = prev.previousElementSibling;
          }
          for (const sp of seps) {
            if (sp.classList.contains('week-sep') && sp.dataset.week === prevWeek) sp.remove();
            else if (sp.classList.contains('date-sep') && sp.dataset.month === prevMonth) sp.remove();
          }
          break;
        }
      }
    }

    // Update spacer
    this._spacerEndIdx = loadFrom;
    if (this._spacerEndIdx <= 0) {
      // Remove spacer entirely
      if (this._spacerObs) this._spacerObs.disconnect();
      spacer.remove();
    } else {
      const skipRows = Math.ceil(this._spacerEndIdx / cols);
      spacer.style.height = `${skipRows * rowH}px`;
    }
  },
  showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); },
  showError(m) { const e=document.getElementById('loginError'); e.textContent=m; e.style.display='block'; },
  toast(m) {
    // Show centered toast inside lightbox
    if (document.getElementById('lightbox').classList.contains('active')) {
      const lt = document.getElementById('lbToast');
      if (lt) { lt.textContent = m; lt.style.opacity = '1'; clearTimeout(lt._timer); lt._timer = setTimeout(() => lt.style.opacity = '0', 1500); }
      return;
    }
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000);
  },
  lbRandom() {
    if (this.currentFiles.length <= 1) return;
    let n; do { n = Math.floor(Math.random() * this.currentFiles.length); } while (n === this.lbIndex);
    if (this.ssRunning) { clearTimeout(this.ssTimer); this.ssTimer = null; }
    this.lbIndex = n;
    this.showLBItem(n).then(() => { if (this.ssRunning) this.ssScheduleNext(); });
  },

  // ===== SORT =====
  _currentSort: 'date_desc',

  toggleNameSort() {
    const newMode = this._currentSort === 'name_asc' ? 'name_desc' : 'name_asc';
    this.sortFiles(newMode);
  },

  toggleSizeSort() {
    const newMode = this._currentSort === 'size_asc' ? 'size_desc' : 'size_asc';
    this.sortFiles(newMode);
  },

  toggleDateSort() {
    const newMode = this._currentSort === 'date_desc' ? 'date_asc' : 'date_desc';
    this.sortFiles(newMode);
  },

  sortFiles(mode) {
    if (!this.originalFiles.length) {
      this.originalFiles = [...this.currentFiles];
    }

    switch (mode) {
      case 'name_asc':
        this.currentFiles = [...this.originalFiles].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric:true}));
        break;
      case 'name_desc':
        this.currentFiles = [...this.originalFiles].sort((a, b) => b.name.localeCompare(a.name, undefined, {numeric:true}));
        break;
      case 'size_asc':
        this.currentFiles = [...this.originalFiles].sort((a, b) => (a.size || 0) - (b.size || 0));
        break;
      case 'size_desc':
        this.currentFiles = [...this.originalFiles].sort((a, b) => (b.size || 0) - (a.size || 0));
        break;
      case 'date_asc':
        this.currentFiles = [...this.originalFiles].sort((a, b) => {
          const at = a.mtime || 0, bt = b.mtime || 0;
          if (!at && !bt) return 0;
          if (!at) return 1;
          if (!bt) return -1;
          return at - bt;
        });
        break;
      case 'date_desc':
        this.currentFiles = [...this.originalFiles].sort((a, b) => {
          const at = a.mtime || 0, bt = b.mtime || 0;
          if (!at && !bt) return 0;
          if (!at) return 1;
          if (!bt) return -1;
          return bt - at;
        });
        break;
      case 'shuffle':
        this.currentFiles = [...this.originalFiles];
        for (let i = this.currentFiles.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [this.currentFiles[i], this.currentFiles[j]] = [this.currentFiles[j], this.currentFiles[i]];
        }
        break;
      case 'added_desc':
        if (this._favMode) {
          const favOrder = new Map(this.favData.map((f, i) => [f.origDriveId, i]));
          this.currentFiles = [...this.originalFiles].sort((a, b) => (favOrder.get(b.origDriveId) ?? 0) - (favOrder.get(a.origDriveId) ?? 0));
        }
        break;
      case 'added_asc':
        if (this._favMode) {
          const favOrder2 = new Map(this.favData.map((f, i) => [f.origDriveId, i]));
          this.currentFiles = [...this.originalFiles].sort((a, b) => (favOrder2.get(a.origDriveId) ?? 0) - (favOrder2.get(b.origDriveId) ?? 0));
        }
        break;
    }
    this._currentSort = mode;
    this.shuffled = (mode === 'shuffle');
    this.renderGallery();

    // Update button arrows and active states
    const nameArrow = document.getElementById('sortNameArrow');
    const sizeArrow = document.getElementById('sortSizeArrow');
    const dateArrow = document.getElementById('sortDateArrow');
    if (nameArrow) nameArrow.textContent = this._currentSort === 'name_desc' ? '↓' : '↑';
    if (sizeArrow) sizeArrow.textContent = this._currentSort === 'size_desc' ? '↓' : '↑';
    if (dateArrow) dateArrow.textContent = this._currentSort === 'date_asc' ? '↑' : '↓';
    document.querySelectorAll('.shuffle-btn, #sortNameBtn, #sortSizeBtn, #sortDateBtn, #sortAddedBtn').forEach(b => b.classList.remove('active'));
    const activeMap = { shuffle: '.shuffle-btn', name_asc: '#sortNameBtn', name_desc: '#sortNameBtn', size_asc: '#sortSizeBtn', size_desc: '#sortSizeBtn', date_asc: '#sortDateBtn', date_desc: '#sortDateBtn', added_desc: '#sortAddedBtn', added_asc: '#sortAddedBtn' };
    const activeEl = document.querySelector(activeMap[mode]);
    if (activeEl) activeEl.classList.add('active');
    // Update added arrow
    const addedArrow = document.getElementById('sortAddedArrow');
    if (addedArrow) addedArrow.textContent = this._currentSort === 'added_asc' ? '↑' : '↓';

    const labels = { name_asc: '이름 ↑', name_desc: '이름 ↓', size_asc: '크기 ↑', size_desc: '크기 ↓', date_asc: '날짜 ↑ (오래된순)', date_desc: '날짜 ↓ (최신순)', shuffle: '🔀 셔플', added_desc: '추가순 ↓ (최신)', added_asc: '추가순 ↑ (오래된순)' };
    this.toast(`정렬: ${labels[mode]}`);
  },

  // ===== MULTI-SELECT =====
  toggleSelect(idx, shiftKey) {
    const file = this.currentFiles[idx];
    if (!file) return;

    if (shiftKey && this._lastSelectedIdx >= 0) {
      const from = Math.min(this._lastSelectedIdx, idx);
      const to = Math.max(this._lastSelectedIdx, idx);
      for (let i = from; i <= to; i++) {
        const f = this.currentFiles[i];
        if (f) this.selectedSet.add(f.origDriveId);
      }
    } else {
      if (this.selectedSet.has(file.origDriveId)) {
        this.selectedSet.delete(file.origDriveId);
      } else {
        this.selectedSet.add(file.origDriveId);
      }
    }
    this._lastSelectedIdx = idx;
    this._updateSelectionUI();
  },

  clearSelection() {
    this.selectedSet.clear();
    this._lastSelectedIdx = -1;
    this._updateSelectionUI();
  },

  _updateSelectionUI() {
    // Update grid items
    document.querySelectorAll('#galleryGrid .gallery-item').forEach(el => {
      const idx = parseInt(el.dataset.idx);
      const file = this.currentFiles[idx];
      if (file) el.classList.toggle('selected', this.selectedSet.has(file.origDriveId));
    });
    // Show/hide batch actions
    const ba = document.getElementById('batchActions');
    const count = this.selectedSet.size;
    if (ba) {
      ba.classList.toggle('show', count > 0);
      document.getElementById('batchCount').textContent = count > 0 ? `${count}개` : '';
    }
    // Hide scroll-top button while in selection mode
    const topBtn = document.getElementById('scrollTopBtn');
    if (topBtn) topBtn.classList.toggle('hide-for-batch', count > 0);
  },

  batchFavAdd() {
    let added = 0;
    for (const id of this.selectedSet) {
      if (this.favSet.has(id)) continue;
      const f = this.currentFiles.find(x => x.origDriveId === id);
      if (!f) continue;
      this.favSet.add(id);
      this.favData.push({
        origDriveId: f.origDriveId, thumbDriveId: f.thumbDriveId,
        name: f.name, type: f.type, size: f.size, mtime: f.mtime,
        _folderId: f._folderId || this.currentFolderId,
        _folderName: f._folderName || (this.navStack.length ? this.navStack[this.navStack.length - 1].name : '')
      });
      added++;
    }
    this.saveFavorites();
    this.clearSelection();
    this.updateFavBadges();
    this.toast(`즐겨찾기 ${added}개 추가`);
  },

  batchFavRemove() {
    let removed = 0;
    for (const id of this.selectedSet) {
      if (!this.favSet.has(id)) continue;
      this.favSet.delete(id);
      this.favData = this.favData.filter(d => d.origDriveId !== id);
      removed++;
    }
    this.saveFavorites();
    this.clearSelection();
    this.updateFavBadges();
    this.toast(`즐겨찾기 ${removed}개 해제`);
  },

  batchDelete() {
    const ids = [...this.selectedSet];
    for (const id of ids) {
      const f = this.currentFiles.find(x => x.origDriveId === id);
      if (!f) continue;
      this.hiddenSet.add(id);
      this.hiddenData.push({
        origDriveId: f.origDriveId, thumbDriveId: f.thumbDriveId,
        name: f.name, type: f.type, size: f.size,
        _folderId: f._folderId || this.currentFolderId,
        _folderName: f._folderName || (this.navStack.length ? this.navStack[this.navStack.length - 1].name : ''),
        _hiddenAt: Date.now()
      });
      // Also remove from favorites
      if (this.favSet.has(id)) {
        this.favSet.delete(id);
        this.favData = this.favData.filter(d => d.origDriveId !== id);
      }
    }
    this.currentFiles = this.currentFiles.filter(f => !this.selectedSet.has(f.origDriveId));
    if (this.originalFiles.length) {
      this.originalFiles = this.originalFiles.filter(f => !this.selectedSet.has(f.origDriveId));
    }
    if (this._folderFilesCache) {
      this._folderFilesCache = this._folderFilesCache.filter(f => !this.selectedSet.has(f.origDriveId));
    }
    this.saveHidden();
    this.saveFavorites();
    this._updateFileCount();
    const count = ids.length;
    this.clearSelection();
    this.renderGallery();
    this.toast(`${count}개 삭제됨`);
  },

  // ===== FAVORITES VIEW =====
  openFavorites() {
    this._favMode = true;
    this._trashMode = false;
    this._favFilter = 'all';
    this._favStatusFilter = 'all';
    this._folderFilesCache = null;
    this.navStack = [{ id: '__favorites__', name: '즐겨찾기' }];
    this.currentFolderId = '__favorites__';

    this.stopSlideshow(true);
    if (this.bgPreloadAbort) this.bgPreloadAbort.abort = true;
    this.preloadCache.forEach(u => URL.revokeObjectURL(u));
    this.preloadCache.clear();
    this._thumbQueue = [];
    this.shuffled = false;
    this.selectedSet.clear(); this._lastSelectedIdx = -1;
    this.originalFiles = [];
    this._monthFilters.clear();
    const _mfChip = document.getElementById('monthFilterChip'); if (_mfChip) _mfChip.remove();
    const _mfPanel = document.getElementById('monthPickerPanel'); if (_mfPanel) _mfPanel.classList.remove('open');
    const _mfBtn = document.getElementById('monthPickerBtn'); if (_mfBtn) { _mfBtn.classList.remove('active'); _mfBtn.classList.remove('filtered'); }

    this.showScreen('mainScreen');
    this.renderBreadcrumb();
    if (!this._skipHistory) { this._saveScrollToHistory(); history.pushState({ view: 'favorites' }, ''); }

    const allFavFiles = [...this.favData].reverse();
    this.currentFiles = allFavFiles;
    this.originalFiles = [...allFavFiles];
    this._currentSort = 'added_desc';

    const area = document.getElementById('contentArea');
    const toolbar = document.getElementById('toolbar');
    toolbar.style.display = 'flex';
    this._updateFileCount(allFavFiles);

    // Add filter buttons to toolbar (before spacer) — no fav status filter in favorites view
    this._orientFilter = 'all';
    let filterDiv = document.getElementById('favFilterDiv');
    if (!filterDiv) {
      filterDiv = document.createElement('div');
      filterDiv.id = 'favFilterDiv';
      filterDiv.className = 'fav-filter';
      filterDiv.innerHTML = this._getFilterHTML(false);
      toolbar.insertBefore(filterDiv, toolbar.querySelector('.spacer'));
    } else {
      filterDiv.style.display = 'flex';
      filterDiv.innerHTML = this._getFilterHTML(false);
    }
    // Add "추가순" sort button (favorites only) — after date button
    let addedBtn = document.getElementById('sortAddedBtn');
    if (!addedBtn) {
      addedBtn = document.createElement('button');
      addedBtn.id = 'sortAddedBtn';
      addedBtn.className = 'sort-btn sort-added active';
      addedBtn.innerHTML = '<svg class="sort-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg> 추가순 <span class="sort-arrow" id="sortAddedArrow">↓</span>';
      addedBtn.onclick = () => this.sortFiles(this._currentSort === 'added_desc' ? 'added_asc' : 'added_desc');
      const dateBtn = document.getElementById('sortDateBtn');
      if (dateBtn) dateBtn.after(addedBtn);
      else toolbar.insertBefore(addedBtn, toolbar.querySelector('.spacer'));
    } else {
      addedBtn.style.display = '';
      addedBtn.classList.add('active');
    }

    area.innerHTML = `<div class="gallery-grid" id="galleryGrid" style="grid-template-columns:repeat(auto-fill,minmax(${this.gridSize}px,1fr))"></div>`;
    this.renderGallery();
    this._updateFilterIndicator();
  },

  _getFilterHTML(showFavStatus) {
    let html = `<button class="active" data-filter="type" onclick="app.filterType('all')">전체</button><button data-filter="type" onclick="app.filterType('image')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-1px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg> 사진</button><button data-filter="type" onclick="app.filterType('video')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-1px"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> 영상</button><span style="margin:0 4px;color:var(--border)">│</span><button data-filter="orient" onclick="app.filterOrientation('portrait')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-1px"><rect x="6" y="3" width="12" height="18" rx="2"/></svg> 세로</button><button data-filter="orient" onclick="app.filterOrientation('landscape')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-1px"><rect x="3" y="6" width="18" height="12" rx="2"/></svg> 가로</button>`;
    if (showFavStatus) {
      html += `<span style="margin:0 4px;color:var(--border)">│</span><button class="active" data-filter="favst" onclick="app.filterFavStatus('all')">전체</button><button data-filter="favst" onclick="app.filterFavStatus('fav')"><svg width="12" height="12" viewBox="0 0 24 24" stroke="none" style="fill:var(--grease);vertical-align:-1px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> 즐겨찾기</button><button data-filter="favst" onclick="app.filterFavStatus('nonfav')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-1px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> 미등록</button>`;
    }
    return html;
  },

  toggleSection(key) {
    if (!key) return;
    if (this._collapsedKeys.has(key)) this._collapsedKeys.delete(key);
    else this._collapsedKeys.add(key);
    this._applySectionVis();
  },

  _applySectionVis() {
    const grid = document.getElementById('galleryGrid');
    if (!grid) return;
    grid.querySelectorAll('.date-sep[data-month]').forEach(el => {
      el.classList.toggle('collapsed', this._collapsedKeys.has(el.dataset.month));
    });
    grid.querySelectorAll('.week-sep').forEach(el => {
      el.style.display = this._collapsedKeys.has(el.dataset.month) ? 'none' : '';
      el.classList.toggle('collapsed', this._collapsedKeys.has(el.dataset.week));
    });
    grid.querySelectorAll('.gallery-item[data-month]').forEach(el => {
      const hide = this._collapsedKeys.has(el.dataset.month) || (el.dataset.week && this._collapsedKeys.has(el.dataset.week));
      el.style.display = hide ? 'none' : '';
    });
  },

  _isPortrait(f) {
    const n = f._folderName || '';
    return /^\d+$/.test(n) || n.startsWith('Soft_') || n === '2.Portrait';
  },

  _isLandscape(f) {
    const n = f._folderName || '';
    return /^[Ww]ide_/.test(n) || n === '1.Landscape' || n === '3.Longform';
  },

  filterType(mode) {
    this._favFilter = mode;
    this._applyFilters();
  },

  filterOrientation(mode) {
    // Toggle: clicking same orientation deactivates
    this._orientFilter = this._orientFilter === mode ? 'all' : mode;
    this._applyFilters();
  },

  filterFavStatus(mode) {
    this._favStatusFilter = this._favStatusFilter === mode && mode !== 'all' ? 'all' : mode;
    this._applyFilters();
  },

  resetAllFilters() {
    this._favFilter = 'all';
    this._orientFilter = 'all';
    this._favStatusFilter = 'all';
    this._monthFilters.clear();
    document.querySelectorAll('.month-picker-btn').forEach(b => b.classList.remove('filtered'));
    this._applyFilters();
    this._updateMonthFilterChip();
    this._refreshOpenMonthPickers();
  },

  _updateFileCount(list) {
    list = list || this.currentFiles;
    const el = document.getElementById('fileCount');
    if (!el) return;
    const n = list.length;
    const imgs = list.filter(f => !f.type?.startsWith('video/')).length;
    const vids = n - imgs;
    let html = `${n.toLocaleString()}개 파일`;
    if (imgs > 0 && vids > 0) {
      html += ` <span style="opacity:0.55;font-size:11px;margin-left:6px;">사진 ${imgs.toLocaleString()} · 영상 ${vids.toLocaleString()}</span>`;
    }
    el.innerHTML = html;
  },

  _updateFilterIndicator() {
    const indicator = document.getElementById('filterIndicator');
    if (!indicator) return;
    let count = 0;
    if (this._favFilter && this._favFilter !== 'all') count++;
    if (this._orientFilter && this._orientFilter !== 'all') count++;
    if (this._favStatusFilter && this._favStatusFilter !== 'all') count++;
    if (this._monthFilters.size) count++;
    if (count > 0 && this.currentFolderId !== this.rootDriveId && !this._trashMode) {
      indicator.classList.add('show');
      const countEl = document.getElementById('filterIndicatorCount');
      if (countEl) countEl.textContent = count;
    } else {
      indicator.classList.remove('show');
    }
  },

  toggleGridSlider() {
    const panel = document.getElementById('gridSliderPanel');
    const btn = document.getElementById('gridSliderBtn');
    const slider = document.getElementById('gridSlider');
    if (!panel) return;
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
      if (btn) btn.classList.remove('active');
    } else {
      if (slider) slider.value = this.gridSize;
      panel.classList.add('open');
      if (btn) btn.classList.add('active');
    }
  },

  // Legacy alias
  filterFavorites(mode) { this.filterType(mode); },

  // Unfiltered base list for the current view (single source for every filter)
  _filterBaseFiles() {
    if (this.currentFolderId === '__favorites__') return [...this.favData].reverse();
    if (this.currentFolderId === '__random1000__') return [...this._r1000Cache];
    return [...(this._folderFilesCache || this.originalFiles)];
  },

  _applyFilters() {
    let source = this._filterBaseFiles();

    // Month filter
    if (this._monthFilters.size) {
      source = source.filter(f => {
        if (!f.mtime) return false;
        const d = new Date(f.mtime);
        return this._monthFilters.has(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
      });
    }

    // Type filter
    if (this._favFilter === 'image') {
      source = source.filter(f => !f.type?.startsWith('video/'));
    } else if (this._favFilter === 'video') {
      source = source.filter(f => f.type?.startsWith('video/'));
    }

    // Orientation filter
    if (this._orientFilter === 'portrait') {
      source = source.filter(f => this._isPortrait(f));
    } else if (this._orientFilter === 'landscape') {
      source = source.filter(f => this._isLandscape(f));
    }

    // Favorites status filter
    if (this._favStatusFilter === 'fav') {
      source = source.filter(f => this.favSet.has(f.origDriveId));
    } else if (this._favStatusFilter === 'nonfav') {
      source = source.filter(f => !this.favSet.has(f.origDriveId));
    }

    this.currentFiles = source;
    this.originalFiles = [...source];
    this._updateFileCount();

    // Update type button states
    document.querySelectorAll('#favFilterDiv [data-filter="type"]').forEach(b => b.classList.remove('active'));
    const typeIdx = { all: 0, image: 1, video: 2 };
    const typeBtns = document.querySelectorAll('#favFilterDiv [data-filter="type"]');
    if (typeBtns[typeIdx[this._favFilter]]) typeBtns[typeIdx[this._favFilter]].classList.add('active');

    // Update orientation button states
    document.querySelectorAll('#favFilterDiv [data-filter="orient"]').forEach(b => b.classList.remove('active'));
    if (this._orientFilter !== 'all') {
      const orientBtns = document.querySelectorAll('#favFilterDiv [data-filter="orient"]');
      if (this._orientFilter === 'portrait' && orientBtns[0]) orientBtns[0].classList.add('active');
      if (this._orientFilter === 'landscape' && orientBtns[1]) orientBtns[1].classList.add('active');
    }

    // Update favorites status button states
    document.querySelectorAll('#favFilterDiv [data-filter="favst"]').forEach(b => b.classList.remove('active'));
    const favStIdx = { all: 0, fav: 1, nonfav: 2 };
    const favStBtns = document.querySelectorAll('#favFilterDiv [data-filter="favst"]');
    if (favStBtns[favStIdx[this._favStatusFilter]]) favStBtns[favStIdx[this._favStatusFilter]].classList.add('active');

    if (this._currentSort !== 'date_desc') this.sortFiles(this._currentSort);
    else this.renderGallery();
    this._updateFilterIndicator();
  },

  // ===== HIDDEN FILES =====
  async loadHidden() {
    try {
      const fid = await Drive.findFile('_hidden.enc', this.rootDriveId);
      if (fid) {
        this.hiddenFileId = fid;
        const list = await Crypto.decryptJSON(this.key, await Drive.download(fid));
        // Migration: old format is string array, new format is object array
        if (list.length > 0 && typeof list[0] === 'string') {
          this.hiddenSet = new Set(list);
          this.hiddenData = list.map(id => ({ origDriveId: id, name: '(이전 데이터)', _hiddenAt: 0 }));
        } else {
          this.hiddenData = list;
          this.hiddenSet = new Set(list.map(f => f.origDriveId));
        }
        console.log(`숨김 파일 ${this.hiddenSet.size}개 로드됨`);
      }
      this._hiddenCloudLoaded = true;
    } catch (e) {
      console.error('Hidden list load failed:', e);
    }
  },

  async saveHidden() {
    // Cloud-loaded guard: never overwrite cloud data unless this session loaded it successfully
    if (!this._hiddenCloudLoaded) {
      console.error('saveHidden blocked: hidden list was not loaded from cloud this session');
      this.toast('숨김 목록 동기화 실패 상태 — 저장이 차단됐어요. 새로고침 후 다시 시도하세요');
      return;
    }
    try {
      const enc = await Crypto.encryptJSON(this.key, this.hiddenData);
      if (this.hiddenFileId) {
        await Drive.update(this.hiddenFileId, enc);
      } else {
        this.hiddenFileId = await Drive.upload('_hidden.enc', enc, this.rootDriveId);
      }
    } catch (e) {
      console.error('Hidden list save failed:', e);
      this.toast('숨김 목록 저장 실패');
    }
  },

  async hideCurrentFile() {
    if (!this.currentFiles.length) return;
    const f = this.currentFiles[this.lbIndex];
    this.hiddenSet.add(f.origDriveId);
    this.hiddenData.push({
      origDriveId: f.origDriveId, thumbDriveId: f.thumbDriveId,
      name: f.name, type: f.type, size: f.size,
      _folderId: f._folderId || this.currentFolderId,
      _folderName: f._folderName || (this.navStack.length ? this.navStack[this.navStack.length - 1].name : ''),
      _hiddenAt: Date.now()
    });

    // Also remove from favorites
    if (this.favSet.has(f.origDriveId)) {
      this.favSet.delete(f.origDriveId);
      this.favData = this.favData.filter(d => d.origDriveId !== f.origDriveId);
      this.saveFavorites();
    }

    // Remove from current list
    this.currentFiles.splice(this.lbIndex, 1);
    if (this.originalFiles.length) {
      this.originalFiles = this.originalFiles.filter(of => of.origDriveId !== f.origDriveId);
    }
    if (this._folderFilesCache) {
      this._folderFilesCache = this._folderFilesCache.filter(of => of.origDriveId !== f.origDriveId);
    }

    this.saveHidden();
    this._updateFileCount();

    if (this.currentFiles.length === 0) {
      this.closeLightbox();
      this.renderGallery();
    } else {
      if (this.lbIndex >= this.currentFiles.length) this.lbIndex = this.currentFiles.length - 1;
      await this.showLBItem(this.lbIndex);
      this.renderGallery();
    }
    this.toast('숨김 처리됨');
  },

  // ===== TRASH VIEW =====
  openTrash() {
    this._favMode = false;
    this._trashMode = true;
    this._favStatusFilter = 'all';
    this._folderFilesCache = null;
    this.navStack = [{ id: '__trash__', name: '휴지통' }];
    this.currentFolderId = '__trash__';

    this.stopSlideshow(true);
    if (this.bgPreloadAbort) this.bgPreloadAbort.abort = true;
    this.preloadCache.forEach(u => URL.revokeObjectURL(u));
    this.preloadCache.clear();
    this._thumbQueue = [];
    this.shuffled = false;
    this.selectedSet.clear(); this._lastSelectedIdx = -1;
    this.originalFiles = [];
    this._monthFilters.clear();
    const _mtrChip = document.getElementById('monthFilterChip'); if (_mtrChip) _mtrChip.remove();
    const _mtrPanel = document.getElementById('monthPickerPanel'); if (_mtrPanel) _mtrPanel.classList.remove('open');
    const _mtrBtn = document.getElementById('monthPickerBtn'); if (_mtrBtn) { _mtrBtn.classList.remove('active'); _mtrBtn.classList.remove('filtered'); }

    this.showScreen('mainScreen');
    this.renderBreadcrumb();
    if (!this._skipHistory) { this._saveScrollToHistory(); history.pushState({ view: 'trash' }, ''); }

    const trashFiles = [...this.hiddenData].reverse();
    this.currentFiles = trashFiles;
    this.originalFiles = [...trashFiles];

    const area = document.getElementById('contentArea');
    const toolbar = document.getElementById('toolbar');
    toolbar.style.display = 'flex';
    this._updateFileCount(trashFiles);

    // Hide fav filter if visible
    const filterDiv = document.getElementById('favFilterDiv');
    if (filterDiv) filterDiv.style.display = 'none';

    area.innerHTML = `<div class="gallery-grid" id="galleryGrid" style="grid-template-columns:repeat(auto-fill,minmax(${this.gridSize}px,1fr))"></div>`;
    this.renderTrashGallery();
    this._updateFilterIndicator();
  },

  renderTrashGallery() {
    const grid = document.getElementById('galleryGrid');
    if (!grid) return;
    grid.innerHTML = '';

    if (this._thumbObserver) this._thumbObserver.disconnect();
    this._thumbObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const el = entry.target;
        const driveId = el.dataset.thumbId;
        if (driveId) { this.loadThumb(driveId, el); el.removeAttribute('data-thumb-id'); }
        this._thumbObserver.unobserve(el);
      }
    }, { root: document.getElementById('contentScroll'), rootMargin: '200px' });

    for (let i = 0; i < this.currentFiles.length; i++) {
      const file = this.currentFiles[i];
      const el = document.createElement('div');
      el.className = 'gallery-item trash-item';

      const cached = this.thumbCache.get(file.thumbDriveId);
      if (cached) {
        el.innerHTML = `<img src="${cached}" decoding="async">`;
      } else if (file.thumbDriveId) {
        el.innerHTML = `<div class="loading-placeholder"><div class="spinner"></div></div>`;
        el.dataset.thumbId = file.thumbDriveId;
      } else {
        el.innerHTML = `<div class="loading-placeholder" style="font-size:11px;">미리보기 없음</div>`;
      }

      if (file.type?.startsWith('video/')) el.innerHTML += `<div class="vid-badge">${SGI.play}</div>`;

      const dateStr = file.mtime ? new Date(file.mtime).toISOString().slice(0, 10) : '';
      if (dateStr) el.innerHTML += `<div class="hover-info"><div class="hi-date">${dateStr}</div></div>`;

      // Restore button overlay
      el.innerHTML += `<div class="trash-restore" data-idx="${i}">↩ 복원</div>`;
      el.onclick = (e) => {
        if (e.target.closest('.trash-restore')) {
          this.restoreFile(file);
          el.remove();
        }
      };

      grid.appendChild(el);
      if (!cached && file.thumbDriveId) this._thumbObserver.observe(el);
    }
  },

  restoreFile(f) {
    this.hiddenSet.delete(f.origDriveId);
    this.hiddenData = this.hiddenData.filter(d => d.origDriveId !== f.origDriveId);
    this.currentFiles = this.currentFiles.filter(d => d.origDriveId !== f.origDriveId);
    this.originalFiles = this.originalFiles.filter(d => d.origDriveId !== f.origDriveId);
    this._updateFileCount();
    this.saveHidden();
    this.toast('↩ 복원됨');
  },

  renderTrashPreview() {
    const grid = document.getElementById('trashGrid');
    if (!grid || !this.hiddenData.length) return;

    const items = [...this.hiddenData].reverse().slice(0, 10);
    for (const item of items) {
      const el = document.createElement('div');
      el.className = 'lucky-item trash-preview-item';
      el.innerHTML = `<div style="width:100%;height:100%;background:var(--surface2);display:flex;align-items:center;justify-content:center;"><div class="spinner"></div></div>`;
      if (item.type?.startsWith('video/')) el.innerHTML += `<div class="li-vid">${SGI.play}</div>`;
      el.innerHTML += `<div class="li-badge">${this.esc(item._folderName || '')}</div>`;

      el.onclick = () => this.openTrash();
      grid.appendChild(el);

      if (item.thumbDriveId) this.loadThumbInto(item.thumbDriveId, el);
    }
    this._applyLuckyGridSize();
  },

  // ===== FAVORITES =====
  async loadFavorites() {
    try {
      const fid = await Drive.findFile('_favorites.enc', this.rootDriveId);
      if (fid) {
        this.favFileId = fid;
        this.favData = await Crypto.decryptJSON(this.key, await Drive.download(fid));
        this.favSet = new Set(this.favData.map(f => f.origDriveId));
        console.log(`즐겨찾기 ${this.favSet.size}개 로드됨`);
      }
      this._favCloudLoaded = true;
    } catch (e) { console.error('Favorites load failed:', e); }
  },

  async saveFavorites() {
    // Cloud-loaded guard: never overwrite cloud data unless this session loaded it successfully
    if (!this._favCloudLoaded) {
      console.error('saveFavorites blocked: favorites were not loaded from cloud this session');
      this.toast('즐겨찾기 동기화 실패 상태 — 저장이 차단됐어요. 새로고침 후 다시 시도하세요');
      return;
    }
    try {
      const enc = await Crypto.encryptJSON(this.key, this.favData);
      if (this.favFileId) { await Drive.update(this.favFileId, enc); }
      else { this.favFileId = await Drive.upload('_favorites.enc', enc, this.rootDriveId); }
    } catch (e) { console.error('Favorites save failed:', e); this.toast('즐겨찾기 저장 실패'); }
  },

  async _repairFavMtime() {
    // Find favorites missing mtime
    const missing = this.favData.filter(f => !f.mtime && f._folderId && !f._folderId.startsWith('__'));
    if (!missing.length) return;

    // Group by folder
    const byFolder = {};
    for (const f of missing) {
      if (!byFolder[f._folderId]) byFolder[f._folderId] = [];
      byFolder[f._folderId].push(f);
    }

    console.log(`즐겨찾기 날짜 복구: ${missing.length}개 (${Object.keys(byFolder).length}개 폴더)`);
    let repaired = 0;

    for (const [folderId, items] of Object.entries(byFolder)) {
      try {
        const indexId = await Drive.findFile('_index.enc', folderId);
        if (!indexId) continue;
        const files = await Crypto.decryptJSON(this.key, await Drive.download(indexId));
        const lookup = new Map(files.map(f => [f.origDriveId, f]));

        for (const fav of items) {
          const orig = lookup.get(fav.origDriveId);
          if (orig?.mtime) {
            fav.mtime = orig.mtime;
            repaired++;
          }
        }
      } catch (e) { console.warn(`폴더 ${folderId} 인덱스 로드 실패:`, e); }
    }

    if (repaired > 0) {
      await this.saveFavorites();
      console.log(`즐겨찾기 날짜 복구 완료: ${repaired}개`);
    }
  },

  toggleFirstFav() {
    const f = this.currentFiles[this.lbIndex];
    if (!f) return;
    const heart = document.querySelector('#lbContent .lb-fav-btn');
    if (!heart) return;
    this.toggleFavorite(f, heart);
  },

  toggleFavorite(f, heartEl) {
    const isRemoving = this.favSet.has(f.origDriveId);
    if (isRemoving) {
      this.favSet.delete(f.origDriveId);
      this.favData = this.favData.filter(d => d.origDriveId !== f.origDriveId);
      heartEl.classList.remove('active');
    } else {
      this.favSet.add(f.origDriveId);
      this.favData.push({
        origDriveId: f.origDriveId, thumbDriveId: f.thumbDriveId,
        name: f.name, type: f.type, size: f.size, mtime: f.mtime,
        _folderId: f._folderId || this.currentFolderId,
        _folderName: f._folderName || (this.navStack.length ? this.navStack[this.navStack.length - 1].name : '')
      });
      heartEl.classList.add('active');
    }
    // Trigger center animation
    const wrap = heartEl.parentElement;
    const anim = wrap?.querySelector('.lb-heart-anim');
    if (anim) {
      anim.classList.remove('pop', 'unpop');
      void anim.offsetWidth;
      anim.classList.add(isRemoving ? 'unpop' : 'pop');
    }
    // Show fav toast inside this media wrap
    const favToast = wrap?.querySelector('.lb-fav-toast');
    if (favToast) {
      favToast.textContent = isRemoving ? '즐겨찾기 해제' : '즐겨찾기 추가';
      favToast.style.opacity = '1';
      clearTimeout(favToast._timer);
      favToast._timer = setTimeout(() => favToast.style.opacity = '0', 1500);
    }
    this.saveFavorites();
    this.updateFavBadges();
  },

  updateFavBadges() {
    document.querySelectorAll('#galleryGrid .gallery-item').forEach(el => {
      const existing = el.querySelector('.fav-badge');
      const idx = parseInt(el.dataset.idx);
      const file = this.currentFiles[idx];
      if (file && this.favSet.has(file.origDriveId)) {
        if (!existing) { const b = document.createElement('div'); b.className='fav-badge'; b.innerHTML=SGI.heart; el.appendChild(b); }
      } else {
        if (existing) existing.remove();
      }
    });
  },

  renderFavGrid() {
    const grid = document.getElementById('favGrid');
    if (!grid || !this.favData.length) return;

    // Show most recent first, limit to 10 for preview
    const items = [...this.favData].reverse().slice(0, 10);
    for (const item of items) {
      const el = document.createElement('div');
      el.className = 'lucky-item';
      el.innerHTML = `<div style="width:100%;height:100%;background:var(--surface2);display:flex;align-items:center;justify-content:center;"><div class="spinner"></div></div>`;
      if (item.type?.startsWith('video/')) el.innerHTML += `<div class="li-vid">${SGI.play}</div>`;
      el.innerHTML += `<div class="fav-badge">${SGI.heart}</div>`;
      el.innerHTML += `<div class="li-badge">${this.esc(item._folderName || '')}</div>`;

      el.onclick = () => this.openFavorites();
      grid.appendChild(el);

      if (item.thumbDriveId) this.loadThumbInto(item.thumbDriveId, el);
    }
    this._applyLuckyGridSize();
  },

  // ===== SWIPE =====
  onTouchStart(e) {
    this.touchStartX = e.touches[0].clientX;
    this.touchStartY = e.touches[0].clientY;
  },

  onTouchEnd(e) {
    const dx = e.changedTouches[0].clientX - this.touchStartX;
    const dy = e.changedTouches[0].clientY - this.touchStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    // Must be horizontal swipe, min 50px, more horizontal than vertical
    if (absDx < 50 || absDy > absDx) return;

    if (dx > 0) { this.lbNav(-1); }  // swipe right = previous
    else { this.lbNav(1); }           // swipe left = next
  },

  // ===== MONTH FILTER =====
  toggleMonthPicker() {
    const panel = document.getElementById('monthPickerPanel');
    const btn = document.getElementById('monthPickerBtn');
    if (!panel) return;
    const isOpen = panel.classList.contains('open');
    if (isOpen) {
      panel.classList.remove('open');
      if (btn) btn.classList.remove('active');
    } else {
      this._buildMonthPicker(panel);
      panel.classList.add('open');
      if (btn) btn.classList.add('active');
    }
  },

  _buildMonthPicker(panel) {
    const base = this._filterBaseFiles();
    const monthMap = new Map();
    for (const f of base) {
      if (!f.mtime) continue;
      const d = new Date(f.mtime);
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!monthMap.has(key)) monthMap.set(key, { label: `${d.getFullYear()}년 ${d.getMonth()+1}월`, count: 0 });
      monthMap.get(key).count++;
    }
    const months = [...monthMap.entries()].sort((a, b) => b[0].localeCompare(a[0]));
    if (!months.length) {
      panel.innerHTML = '<div style="padding:12px;color:var(--text2);font-size:13px;text-align:center;">날짜 정보 없음</div>';
      return;
    }
    const sel = this._monthFilters.size;
    let h = `<div style="padding:4px 8px 6px;font-size:11px;font-weight:600;color:var(--text2);letter-spacing: 0;display:flex;align-items:center;justify-content:space-between;gap:8px;"><span>연/월 필터</span><span style="${sel ? 'color:var(--accent-hover);' : 'opacity:0.55;font-weight:500;'}">${sel ? sel + '개 선택' : '복수 선택'}</span></div>`;
    h += `<div class="month-picker-item${sel ? '' : ' mp-idle'}" onclick="app.clearMonthFilter()" style="color:var(--text2);margin-bottom:4px;border-bottom:1px solid var(--border);border-radius:0;padding-bottom:10px;">
      <span style="display:flex;align-items:center;gap:7px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>전체 보기</span>
    </div>`;
    for (const [key, { label, count }] of months) {
      const isActive = this._monthFilters.has(key);
      h += `<div class="month-picker-item${isActive ? ' active' : ''}" onclick="app.toggleMonthFilter('${key}')">
        <span style="display:flex;align-items:center;gap:8px;"><span class="mp-check${isActive ? ' on' : ''}">${isActive ? SGI.check : ''}</span>${label}</span>
        <span style="font-size:11px;opacity:0.7;">${count.toLocaleString()}개</span>
      </div>`;
    }
    panel.innerHTML = h;
  },

  toggleMonthFilter(monthKey) {
    if (!monthKey) return;
    if (this._monthFilters.has(monthKey)) this._monthFilters.delete(monthKey);
    else this._monthFilters.add(monthKey);
    this._onMonthFilterChange();
  },

  clearMonthFilter() {
    if (!this._monthFilters.size) return;
    this._monthFilters.clear();
    this._onMonthFilterChange();
  },

  // Picker stays open for multi-select; rebuild it in place instead.
  _refreshOpenMonthPickers() {
    document.querySelectorAll('.month-picker-panel.open').forEach(p => {
      const st = p.scrollTop;
      this._buildMonthPicker(p);
      p.scrollTop = st;
    });
  },

  _onMonthFilterChange() {
    const on = this._monthFilters.size > 0;
    document.querySelectorAll('.month-picker-btn').forEach(b => b.classList.toggle('filtered', on));
    this._applyFilters();
    this._updateMonthFilterChip();
    this._refreshOpenMonthPickers();
  },

  _monthChipLabel() {
    const keys = [...this._monthFilters].sort((a, b) => b.localeCompare(a));
    if (!keys.length) return '';
    const [y, m] = keys[0].split('-');
    const first = `${y}년 ${parseInt(m)}월`;
    return keys.length > 1 ? `${first} 외 ${keys.length - 1}개` : first;
  },

  _renderMonthChip(bar) {
    if (!bar) return null;
    let chip = bar.querySelector('.month-filter-chip');
    if (!this._monthFilters.size) { if (chip) chip.remove(); return null; }
    if (!chip) {
      chip = document.createElement('div');
      chip.className = 'month-filter-chip';
      // Sit right after the 연/월 button so nothing to its left changes width while selecting
      const _mw = bar.querySelector('.month-picker-wrap');
      if (_mw) _mw.after(chip); else bar.insertBefore(chip, bar.firstChild);
    }
    chip.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${this._monthChipLabel()}<span onclick="app.clearMonthFilter()" style="cursor:pointer;opacity:0.7;line-height:0;padding:2px;display:inline-flex" title="필터 해제">${SGI.x}</span>`;
    return chip;
  },

  _updateMonthFilterChip() {
    const chip = this._renderMonthChip(document.getElementById('toolbar'));
    if (chip) chip.id = 'monthFilterChip';
    // Keep the floating toolbar clone in sync while its picker is open
    this._renderMonthChip(document.getElementById('toolbarFloating')?.firstElementChild);
  },

  // ===== FOLDER COVERS =====
  // Per folder (localStorage 'sg_fmeta2'):
  //   { mt: index modifiedTime, n: total files in the index (hidden included),
  //     c: up to 10 cover candidates [{o: origDriveId, t: thumbDriveId, v: isVideo}] in rotation order }
  // Photo folders: 10 random picks. Video folders (half or more videos): 5 newest + 5 random.
  // A folder's candidates are re-picked whenever its index changes (e.g. new uploads).
  // The cover rotates once a day through the candidates; hidden files are skipped and subtracted from the count.
  _folderMeta: null,
  _fmetaBusy: false,
  _fmetaLast: 0,
  _coverQueue: [],
  _coverActive: 0,
  _fmetaLoad() {
    if (this._folderMeta) return;
    try { localStorage.removeItem('sg_fmeta'); } catch {}  // old format (newest-4), superseded
    try { this._folderMeta = JSON.parse(localStorage.getItem('sg_fmeta2') || '{}') || {}; } catch { this._folderMeta = {}; }
  },
  _fmetaSave() {
    try { localStorage.setItem('sg_fmeta2', JSON.stringify(this._folderMeta)); } catch {}
  },
  _pickCoverCandidates(files) {
    const pool = files.filter(f => f.thumbDriveId && !this.hiddenSet.has(f.origDriveId));
    const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const isVideoFolder = pool.length > 0 && pool.filter(f => f.type?.startsWith('video/')).length * 2 >= pool.length;
    let picks;
    if (isVideoFolder) {
      const byNew = [...pool].sort((a, b) => (b.mtime || 0) - (a.mtime || 0));
      const newest = byNew.slice(0, 5);
      const randoms = shuffle(byNew.slice(5)).slice(0, 5);
      // interleave so new uploads come up every other day
      picks = [];
      for (let k = 0; k < 5; k++) { if (newest[k]) picks.push(newest[k]); if (randoms[k]) picks.push(randoms[k]); }
    } else {
      picks = shuffle([...pool]).slice(0, 10);
    }
    return picks.map(f => ({ o: f.origDriveId, t: f.thumbDriveId, v: f.type?.startsWith('video/') ? 1 : 0 }));
  },
  async _refreshFolderMeta() {
    if (this._fmetaBusy || !this.key) return;
    if (Date.now() - this._fmetaLast < 10 * 60 * 1000) return;  // at most every 10 minutes
    this._fmetaBusy = true;
    try {
      this._fmetaLoad();
      const idx = await Drive.listIndexFiles();
      const stale = idx.filter(x => x.parents && x.parents[0] && this._folderMeta[x.parents[0]]?.mt !== x.modifiedTime);
      let i = 0, changed = 0;
      const worker = async () => {
        while (i < stale.length) {
          const x = stale[i++];
          try {
            const files = await Crypto.decryptJSON(this.key, await Drive.download(x.id));
            this._folderMeta[x.parents[0]] = { mt: x.modifiedTime, n: files.length, c: this._pickCoverCandidates(files) };
            changed++;
            this._paintFolderCovers(x.parents[0]);
          } catch {}
        }
      };
      await Promise.all(Array.from({ length: 4 }, worker));
      if (changed) this._fmetaSave();
      this._fmetaLast = Date.now();
    } catch (e) { console.warn('Folder cover refresh failed:', e); }
    finally { this._fmetaBusy = false; }
  },
  _coverPump() {
    while (this._coverActive < 6 && this._coverQueue.length) {
      const job = this._coverQueue.shift();
      if (!job.img.isConnected) continue;
      this._coverActive++;
      this._thumbUrl(job.t).then(u => { job.img.src = u; }).catch(() => {}).finally(() => { this._coverActive--; this._coverPump(); });
    }
  },
  // Local day number (changes at local midnight)
  _dayNumber() {
    const d = new Date();
    return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  },
  // Stable per-folder offset so folders don't all advance in lockstep
  _folderOffset(id) {
    let h = 0;
    for (let k = 0; k < id.length; k++) h = (h * 31 + id.charCodeAt(k)) >>> 0;
    return h;
  },
  // Today's cover for a folder (step = 0), or a neighbouring candidate (step > 0); null if none visible
  _coverFor(id, step = 0) {
    const m = this._folderMeta[id];
    if (!m || !m.c) return null;
    const live = m.c.filter(c => !this.hiddenSet.has(c.o));
    if (!live.length) {
      // every candidate was hidden: re-read this folder's index on the next refresh
      if (m.mt) { m.mt = null; this._fmetaLast = 0; this._fmetaSave(); }
      return null;
    }
    return live[(this._dayNumber() + this._folderOffset(id) + step) % live.length];
  },
  _paintFolderCovers(onlyId) {
    this._fmetaLoad();
    // hidden files per folder, for the counts
    const hiddenBy = {};
    for (const h of this.hiddenData) if (h._folderId) hiddenBy[h._folderId] = (hiddenBy[h._folderId] || 0) + 1;
    document.querySelectorAll('.folder-card[data-fid]').forEach(card => {
      const ids = card.dataset.fid.split(',');
      if (onlyId && !ids.includes(onlyId)) return;
      const known = ids.filter(id => this._folderMeta[id]?.c);
      if (!known.length) return;
      const cnt = card.querySelector('.fc-count');
      if (cnt) cnt.textContent = `${known.reduce((s, id) => s + Math.max(0, (this._folderMeta[id].n || 0) - (hiddenBy[id] || 0)), 0).toLocaleString()}개`;
      let picks;
      if (ids.length > 1) {
        // Mosaic: today's cover from each folder, then one more from the first folder
        picks = known.map(id => this._coverFor(id)).filter(Boolean);
        const extra = this._coverFor(known[0], 1);
        if (extra && !picks.some(p => p.t === extra.t)) picks.push(extra);
        picks = picks.slice(0, 4);
      } else {
        const p = this._coverFor(known[0]);
        picks = p ? [p] : [];
      }
      if (!picks.length) return;
      const sig = picks.map(p => p.t).join('|');
      if (card.dataset.coverSig === sig) return;
      card.dataset.coverSig = sig;
      let cover = card.querySelector('.fc-cover');
      if (!cover) { cover = document.createElement('div'); card.prepend(cover); }
      cover.className = 'fc-cover' + (picks.length > 1 ? ' mosaic' : '');
      cover.innerHTML = '';
      let left = picks.length;
      for (const p of picks) {
        const img = document.createElement('img');
        img.className = 'tfade'; img.decoding = 'async'; img.alt = '';
        img.onload = () => { img.classList.add('in'); if (--left <= 0) cover.classList.add('done'); };
        img.onerror = () => { if (--left <= 0) cover.classList.add('done'); };
        cover.appendChild(img);
        this._coverQueue.push({ t: p.t, img });
      }
      let play = card.querySelector('.fc-play');
      if (picks.every(p => p.v)) {
        if (!play) { play = document.createElement('span'); play.className = 'fc-play'; play.innerHTML = SGI.play; card.appendChild(play); }
      } else if (play) play.remove();
      card.classList.add('has-cover');
    });
    this._coverPump();
  },

  // ===== ZOOM TRANSITION (thumbnail <-> lightbox) =====
  _zoomGhost: null,
  _zoomStart: 0,
  _reducedMotion() { return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); },
  _fitRect(nw, nh) {
    const c = document.getElementById('lbContent').getBoundingClientRect();
    const s = Math.min(c.width / nw, c.height / nh);
    const w = nw * s, h = nh * s;
    return { left: c.left + (c.width - w) / 2, top: c.top + (c.height - h) / 2, width: w, height: h };
  },
  _placeGhost(z, r) {
    z.style.left = r.left + 'px'; z.style.top = r.top + 'px';
    z.style.width = r.width + 'px'; z.style.height = r.height + 'px';
  },
  // Transform + clip that make an element laid out at rect T look like the (cover-cropped) tile at rect S
  _ghostAt(T, S, radiusPx) {
    const a = S.width / S.height;
    let cw = T.width, ch = T.height;
    if (T.width / T.height > a) cw = T.height * a; else ch = T.width / a;
    const s = S.width / cw;
    const dx = (S.left + S.width / 2) - (T.left + T.width / 2);
    const dy = (S.top + S.height / 2) - (T.top + T.height / 2);
    return {
      transform: `translate(${dx}px, ${dy}px) scale(${s})`,
      clip: `inset(${(T.height - ch) / 2}px ${(T.width - cw) / 2}px round ${radiusPx / s}px)`
    };
  },
  _ghostSet(z, st) {
    if (st) { z.style.transform = st.transform; z.style.clipPath = st.clip; }
    else { z.style.transform = 'none'; z.style.clipPath = 'inset(0px round 0px)'; }
  },
  _zoomOpen(i) {
    if (this._reducedMotion() || this.viewCount > 1) return;
    const item = document.querySelector(`#galleryGrid .gallery-item[data-idx="${i}"]`);
    const img = item && item.querySelector('img');
    if (!img || !img.complete || !img.naturalWidth) return;
    const r = img.getBoundingClientRect();
    if (r.width < 8 || r.bottom < 0 || r.top > window.innerHeight) return;
    this._endZoom(true);
    const target = this._fitRect(img.naturalWidth, img.naturalHeight);
    const z = document.createElement('img');
    z.className = 'zoom-ghost'; z.src = img.src; z.alt = '';
    this._placeGhost(z, target);                      // laid out once, at the final size
    z.style.transition = 'none';
    this._ghostSet(z, this._ghostAt(target, r, 6));   // start: looks like the tile
    document.body.appendChild(z);
    this._zoomGhost = z;
    this._zoomStart = performance.now();
    z.getBoundingClientRect();                        // commit the start state
    z.style.transition = '';
    requestAnimationFrame(() => this._ghostSet(z, null));
    clearTimeout(this._zoomTimer);
    this._zoomTimer = setTimeout(() => this._endZoom(), 4000);  // safety net
  },
  _endZoom(now) {
    const z = this._zoomGhost;
    if (!z) return;
    this._zoomGhost = null;
    clearTimeout(this._zoomTimer);
    if (now) { z.remove(); return; }
    const wait = Math.max(0, 300 - (performance.now() - this._zoomStart));  // let the grow finish first
    setTimeout(() => { z.style.opacity = '0'; setTimeout(() => z.remove(), 200); }, wait);
  },
  // Ghost sitting on top of the photo being closed; returns it (or null) for _zoomBack
  _zoomCloseStart() {
    if (this._reducedMotion() || this.viewCount > 1) return null;
    const f = this.currentFiles[this.lbIndex];
    const turl = f && this.thumbCache.get(f.thumbDriveId);
    const media = document.querySelector('#lbContent .lb-media-wrap img, #lbContent .lb-media-wrap video');
    if (!turl || !media) return null;
    const clip = media.closest('.kb-clip');
    let r;
    if (clip) r = clip.getBoundingClientRect();
    else {
      const b = media.getBoundingClientRect();
      const nw = media.naturalWidth || media.videoWidth, nh = media.naturalHeight || media.videoHeight;
      if (!nw || !nh || !b.width) return null;
      const s = Math.min(b.width / nw, b.height / nh), w = nw * s, h = nh * s;
      r = { left: b.left + (b.width - w) / 2, top: b.top + (b.height - h) / 2, width: w, height: h };
    }
    if (!r.width || !r.height) return null;
    this._endZoom(true);
    const z = document.createElement('img');
    z.className = 'zoom-ghost'; z.src = turl; z.alt = '';
    this._placeGhost(z, r);
    z.style.transition = 'none';
    this._ghostSet(z, null);
    document.body.appendChild(z);
    z._rect = r;
    return z;
  },
  _zoomBack(z, idx) {
    if (!z) return;
    const done = () => { z.style.opacity = '0'; setTimeout(() => z.remove(), 200); };
    // Measure after two frames: grid items use content-visibility:auto, so sizes settle a frame after the scroll
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const item = document.querySelector(`#galleryGrid .gallery-item[data-idx="${idx}"]`);
      if (!item || item.offsetParent === null) { done(); return; }
      const r = item.getBoundingClientRect();
      if (r.bottom < 0 || r.top > window.innerHeight) { done(); return; }
      z.getBoundingClientRect();
      z.style.transition = '';
      this._ghostSet(z, this._ghostAt(z._rect, r, 6));
      setTimeout(() => z.remove(), 340);
    }));
  },

  // ===== AMBIENT BACKGROUND (photos only; videos stay black) =====
  _ambFlip: false,
  _setAmbient(url) {
    const a = document.getElementById('lbAmbA'), b = document.getElementById('lbAmbB');
    if (!a || !b) return;
    if (!url) { a.classList.remove('on'); b.classList.remove('on'); return; }
    const next = this._ambFlip ? a : b, prev = this._ambFlip ? b : a;
    this._ambFlip = !this._ambFlip;
    next.style.backgroundImage = `url("${url}")`;
    next.classList.add('on');
    prev.classList.remove('on');
  },
  // Called once the new lightbox content is actually visible
  _lbShown(f) {
    const hadGhost = !!this._zoomGhost;
    this._endZoom();
    if (!f || f.type?.startsWith('video/')) { this._setAmbient(null); return; }
    // Reuse the photo already decoded for display; start once the zoom has finished so the two don't compete
    const url = this.preloadCache.get(f.origDriveId) || this.thumbCache.get(f.thumbDriveId);
    const ver = this._showVer;
    const wait = hadGhost ? Math.max(0, 320 - (performance.now() - this._zoomStart)) : 0;
    setTimeout(() => {
      if (ver !== this._showVer || !document.getElementById('lightbox').classList.contains('active')) return;
      this._setAmbient(url);
    }, wait);
  },

  // ===== THEME (system / light / dark) =====
  _themeMode() { try { return localStorage.getItem('sg_theme') || 'system'; } catch { return 'system'; } },
  applyTheme(mode) {
    const light = mode === 'light' || (mode === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', light ? '#ffffff' : '#242526');
    const icons = {
      system: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>',
      light: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      dark: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
    };
    const labels = { system: '자동', light: '라이트', dark: '다크' };
    const ic = document.getElementById('themeIcon'), lb = document.getElementById('themeLabel'), bt = document.getElementById('themeBtn');
    if (ic) ic.innerHTML = icons[mode];
    if (lb) lb.textContent = labels[mode];
    if (bt) bt.title = `테마: ${labels[mode]}${mode === 'system' ? ' (시스템 설정)' : ''}`;
  },
  cycleTheme() {
    const order = ['system', 'light', 'dark'];
    const next = order[(order.indexOf(this._themeMode()) + 1) % order.length];
    try { if (next === 'system') localStorage.removeItem('sg_theme'); else localStorage.setItem('sg_theme', next); } catch {}
    this.applyTheme(next);
    this.toast(`테마: ${({ system: '자동 (시스템 설정)', light: '라이트', dark: '다크' })[next]}`);
  },

  esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
};

// Theme: render button state, and follow OS changes while in 자동 mode

// ===== KEYBOARD =====
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').classList.contains('active')) {
    if(e.key==='Escape') {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else { history.back(); }
    }
    if(e.key==='PageUp') { app.lbNav(-1); }
    if(e.key==='PageDown') { app.lbNav(1); }
    if(e.key==='ArrowUp') { e.preventDefault(); app.lbNav(-1); }
    if(e.key==='ArrowDown') { e.preventDefault(); app.lbNav(1); }
    if(e.key==='ArrowLeft' || e.key==='ArrowRight') {
      const videos = document.querySelectorAll('#lbContent video');
      if (videos.length > 0) {
        e.preventDefault();
        const delta = e.key==='ArrowRight' ? 1 : -1;
        videos.forEach(v => {
          const dur = v.duration || 0;
          v.currentTime = Math.max(0, Math.min(dur, v.currentTime + delta));
        });
      }
    }
    if(e.key===' ') { e.preventDefault(); document.querySelectorAll('#lbContent video').forEach(v=>{v.paused?v.play():v.pause();}); }
    if(e.key==='s'||e.key==='S') { app.toggleSlideshow(); }
    if(e.key==='f'||e.key==='F'||e.key==='Enter') { e.preventDefault(); app.toggleFullscreen(); }
    if(e.key==='d'||e.key==='D') { app.setViewCount(app.viewCount === 2 ? 1 : 2); }
    if(e.key==='t'||e.key==='T') { app.setViewCount(app.viewCount === 3 ? 1 : 3); }
    if(e.key==='1'||e.code==='Digit1') { app.setViewCount(1); }
    if(e.key==='2'||e.code==='Digit2') { app.setViewCount(2); }
    if(e.key==='3'||e.code==='Digit3') { app.setViewCount(3); }
    if(e.key==='b'||e.key==='B') { app.toggleFirstFav(); }
    if(e.key==='Delete') { app.hideCurrentFile(); }
  } else if (e.key === 'Escape') {
    // Close open popovers first, then clear selection
    const anyMonthPanel = document.querySelector('.month-picker-panel.open');
    if (anyMonthPanel) {
      document.querySelectorAll('.month-picker-panel.open').forEach(p => p.classList.remove('open'));
      document.querySelectorAll('.month-picker-btn.active').forEach(b => b.classList.remove('active'));
      return;
    }
    const gridPanel = document.getElementById('gridSliderPanel');
    if (gridPanel && gridPanel.classList.contains('open')) {
      app.toggleGridSlider();
      return;
    }
    if (app.selectedSet && app.selectedSet.size > 0) {
      app.clearSelection();
    }
  }
});

// Immersive mode (iOS standalone): tap toggles lightbox chrome
(function() {
  const lb = document.getElementById('lightbox');
  if (!lb) return;
  let tx = 0, ty = 0;
  lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (!lb.classList.contains('immersive')) return;
    const t = e.changedTouches[0];
    if (Math.abs(t.clientX - tx) > 10 || Math.abs(t.clientY - ty) > 10) return;
    if (e.target.closest('.lb-top, .lb-bottom, .lb-nav, .lb-fav-btn, .lb-goto-btn')) { app._armChromeTimer(); return; }
    if (lb.classList.contains('chrome-show')) app._hideChrome();

})();

// ===== FLOATING TOOLBAR ON SCROLL UP =====
(function() {
  const scroll = document.getElementById('contentScroll');
  const floating = document.getElementById('toolbarFloating');
  if (!scroll || !floating) return;
  let lastScrollTop = 0;
  let rafPending = false;

  function syncFloating() {
    const original = document.getElementById('toolbar');
    if (!original) return;
    const clone = original.cloneNode(true);
    clone.style.display = 'flex';
    // Strip duplicate IDs (original stays canonical)
    clone.removeAttribute('id');
    clone.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));

    // Rewire month picker in clone to use its own panel
    const cloneMonthBtn = clone.querySelector('.month-picker-btn');
    const cloneMonthPanel = clone.querySelector('.month-picker-panel');
    if (cloneMonthBtn && cloneMonthPanel) {
      cloneMonthBtn.onclick = (e) => {
        e.stopPropagation();
        const isOpen = cloneMonthPanel.classList.contains('open');
        // Close all other month panels first
        document.querySelectorAll('.month-picker-panel.open').forEach(p => p.classList.remove('open'));
        document.querySelectorAll('.month-picker-btn.active').forEach(b => b.classList.remove('active'));
        if (!isOpen) {
          app._buildMonthPicker(cloneMonthPanel);
          cloneMonthPanel.classList.add('open');
          cloneMonthBtn.classList.add('active');
        }
      };
    }

    floating.innerHTML = '';
    floating.appendChild(clone);
  }

  // Re-sync when user interacts with floating (to reflect updated state)
  floating.addEventListener('click', (e) => {
    // Skip re-sync if opening month picker (would close it)
    if (e.target.closest('.month-picker-wrap')) return;
    setTimeout(() => {
      if (floating.classList.contains('show')) syncFloating();
    }, 120);
  });

  function update() {
    rafPending = false;
    const original = document.getElementById('toolbar');
    if (!original || original.style.display === 'none') {
      floating.classList.remove('show');
      return;
    }

    const st = scroll.scrollTop;
    const rect = original.getBoundingClientRect();
    const scrollRect = scroll.getBoundingClientRect();
    const toolbarOutOfView = rect.bottom < scrollRect.top;
    const scrollingUp = st < lastScrollTop - 3;
    const scrollingDown = st > lastScrollTop + 3;

    if (scrollingUp && toolbarOutOfView) {
      if (!floating.classList.contains('show')) syncFloating();
      floating.classList.add('show');
    } else if (scrollingDown || !toolbarOutOfView) {
      floating.classList.remove('show');
      // Also close any open month panel in clone
      const clonePanel = floating.querySelector('.month-picker-panel.open');
      const cloneBtn = floating.querySelector('.month-picker-btn.active');
      if (clonePanel) clonePanel.classList.remove('open');
      if (cloneBtn) cloneBtn.classList.remove('active');
    }

    lastScrollTop = st;
  }

  scroll.addEventListener('scroll', () => {
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(update);
    }
  }, { passive: true });
})();

// ===== BROWSER HISTORY =====
window.addEventListener('popstate', e => {
  // Lightbox open? Just close it
  if (document.getElementById('lightbox').classList.contains('active')) {
    app.closeLightbox();
    return;
  }
  const s = e.state;
  // No state = initial page, do nothing (or user leaves site)
  if (!s) return;
  // Stale lightbox entry (lightbox not open but state says lightbox) → skip
  if (s.view === 'lightbox') { history.back(); return; }
  app._skipHistory = true;
  try {
    if (s.view === 'folder') {
      app.navStack = s.navStack || [];
      app.navTo(s.folderId, s.folderName);
    } else if (s.view === 'favorites') {
      app.openFavorites();
    } else if (s.view === 'random1000') {
      app.openRandom1000();
    } else if (s.view === 'mergedwide') {
      app.openMergedWide();
    } else if (s.view === 'trash') {
      app.openTrash();
    }
    // Restore scroll position
    if (s.restoreIdx != null) {
      setTimeout(() => app.scrollToItem(s.restoreIdx), 100);
    } else if (s.restoreScrollTop != null) {
      // Main page needs longer delay (async content loading)
      const tryRestore = () => {
        const scroll = document.getElementById('contentScroll');
        if (scroll && scroll.scrollHeight > scroll.clientHeight) {
          scroll.scrollTop = s.restoreScrollTop;
        } else {
          setTimeout(tryRestore, 100);
        }
      };
      setTimeout(tryRestore, 200);
    }
  } finally {
    app._skipHistory = false;
  }
});
</script>
</body>
</html>
